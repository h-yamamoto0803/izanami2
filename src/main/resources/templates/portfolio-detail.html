<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ポートフォリオ詳細 | Traemon</title>
	<link rel="stylesheet" th:href="@{/css/styles.css}">
	<script th:src="@{/js/common.js}" defer></script>
</head>

<body>

	<div th:replace="~{fragments/header :: header}"></div>

	<main>
		<div class="container">

			<section>

				<h1 class="page-title">ポートフォリオ詳細</h1>
				<p class="page-subtitle">
					職人の作品を詳しく確認できます。
				</p>

				<article class="card detail-card">

					<!-- 職人情報 -->
					<div class="post-top">
						<div>

							<div class="post-author">

								<!-- 職人名 -->
								<span class="post-user"
								      th:text="${portfolio.user.userName}">
								    職人の名前
								</span>

								

							</div>

							<div class="post-date"
							     th:text="${portfolio.createdAt}">
							    2026/09/09 10:00
							</div>

						</div>
					</div>

					<!-- 作品画像 -->
					<div class="portfolio-detail-image">
						<img th:src="${portfolio.imagePath}"
						     alt="作品画像"
						     style="max-width:600px; width:100%; height:auto;">
					</div>

					<!-- 作品説明 -->
					<div class="detail-body">
					    <p th:text="${portfolio.description}">
					        作品説明
					    </p>
					</div>

					<!-- 戻る -->
					<div class="actions">
						<a class="btn btn-secondary" th:href="@{/menu(contentType='portfolio')}">
							戻る
						</a>
					</div>

				</article>

			</section>

		</div>
	</main>

</body>

</html>
