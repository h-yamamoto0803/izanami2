<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>投稿確認 | Traemon</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/common.js" defer></script>
</head>
<body>
<header class="site-header customer-header">
  <div class="container header-inner">
    <a class="logo" href="customer-menu.html">Traemon</a>
    <div class="header-right">
      <span class="role-badge customer"><span class="role-dot"></span>ユーザー</span>
      <a class="header-post customer-post" href="post-create-customer.html">＋ 投稿する</a>
      <div class="notification-wrap">
        <button class="icon-btn" id="notificationButton" type="button" aria-label="通知">🔔</button>
        <div class="notification-panel" id="notificationPanel">
          <div class="notification-item">
            <div>あなたの投稿に反応がありました。</div>
            <small>2026/08/20 10:15</small>
          </div>
          <div class="notification-item">
            <div>「玄関に置ける小さな花器が欲しい」に新しい反応があります。</div>
            <small>2026/08/19 18:40</small>
          </div>
        </div>
      </div>
      <a class="account-btn" href="customer-account.html">伝統工芸が好き</a>
      <a class="logout-btn" href="menu.html">ログアウト</a>
    </div>
  </div>
</header>
<main><div class="container"><section>
  <h1 class="page-title">投稿確認ページ</h1><p class="page-subtitle">以下は確認画面の静的サンプルです。</p>
  <div class="card form-card"><dl class="confirm-list">
    <div class="confirm-row"><dt>名前</dt><dd>伝統工芸が好き</dd></div>
    <div class="confirm-row"><dt>タイトル</dt><dd>玄関に置ける小さな花器が欲しい</dd></div>
    <div class="confirm-row"><dt>投稿内容</dt><dd>玄関に置ける小さな花器を探しています。落ち着いた色味で、長く使えるものが希望です。</dd></div>
    <div class="confirm-row"><dt>カテゴリタグ</dt><dd>#陶芸</dd></div>
  </dl><div class="actions"><a class="btn btn-secondary" href="post-create-customer.html">戻る</a><a class="btn btn-primary" href="customer-menu.html">投稿確定</a></div></div>
</section></div></main>
</body>
</html>
