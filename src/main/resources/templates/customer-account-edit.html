<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ユーザーアカウント編集 | Traemon</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/common.js" defer></script>
</head>
<body>
<header class="site-header customer-header">
  <div class="container header-inner">
    <a class="logo" href="customer-menu.html">Traemon</a>
    <div class="header-right">
      <span class="role-badge customer"><span class="role-dot"></span>ユーザー</span>
      <a class="header-post customer-post" href="post-create-customer.html">＋ 投稿する</a>
      <div class="notification-wrap">
        <button class="icon-btn" id="notificationButton" type="button" aria-label="通知">🔔</button>
        <div class="notification-panel" id="notificationPanel">
          <div class="notification-item">
            <div>あなたの投稿に反応がありました。</div>
            <small>2026/08/20 10:15</small>
          </div>
          <div class="notification-item">
            <div>「玄関に置ける小さな花器が欲しい」に新しい反応があります。</div>
            <small>2026/08/19 18:40</small>
          </div>
        </div>
      </div>
      <a class="account-btn" href="customer-account.html">伝統工芸が好き</a>
      <a class="logout-btn" href="menu.html">ログアウト</a>
    </div>
  </div>
</header>
<main><div class="container"><section>
  <h1 class="page-title">ユーザーアカウント編集</h1><p class="page-subtitle">変更したい情報を入力してください。</p>
  <form class="card form-card" action="customer-account-edit-confirm.html" method="get">
    <div class="form-group"><label for="editUserName">名前</label><input id="editUserName" name="userName" type="text" required value="伝統工芸が好き"></div>
    <div class="form-group"><label for="editEmail">メールアドレス</label><input id="editEmail" name="email" type="email" required value="user@example.com"></div>
    <div class="form-group"><label for="editPassword">パスワード</label><input id="editPassword" name="password" type="password" required value="password"></div>
    <div class="form-group"><label for="editPasswordConfirm">確認用パスワード</label><input id="editPasswordConfirm" name="passwordConfirm" type="password" required value="password"></div>
    <div class="actions"><a class="btn btn-secondary" href="customer-account.html">戻る</a><button class="btn btn-primary" type="submit">確認画面へ</button></div>
  </form>
</section></div></main>
</body>
</html>
