<!doctype html>
<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>アカウント編集 | Traemon</title>
	<link rel="stylesheet" th:href="@{css/styles.css}">
	<script th:src="@{/js/common.js}" defer></script>
</head>

<body>
	<div th:replace="~{fragments/header :: header}"></div>
	</div>
	<main>
		<div class="container">
			<section>
				<h1 class="page-title">ユーザーアカウント編集</h1>
				<p class="page-subtitle">変更したい情報を入力してください。</p>
				<form class="card form-card" th:action="@{/confirmAccountEdit}"
					th:object="${customerAccountEditForm}" method="post">
					<div class="form-group">
						<label for="userName">名前</label>
						<input id="userName" type="text" required maxlength="40" th:field="*{userName}" name="userName">
					</div>
					<div class="form-group">
						<label for="email">メールアドレス</label>
						<input id="email" type="email" required th:field="*{email}" name="email">
					</div>
					<div class="form-group">
						<label for="password">パスワード</label>
						<input pattern="^(?=.*?[a-zA-Z])(?=.*?\d)[a-zA-Z\d]{3,10}$"
						placeholder="パスワード   ※英字と数字を両方含む、3～10文字の半角英数字"
						id="password" type="password" required minlength="6" th:field="*{password}"
							name="password">
					</div>
					<div class="form-group">
						<label for="passwordConfirm">確認用パスワード</label>
						<input pattern="^(?=.*?[a-zA-Z])(?=.*?\d)[a-zA-Z\d]{3,10}$"
						placeholder="確認用パスワード"
						id="passwordConfirm" type="password" required minlength="6" th:field="*{passwordConfirm}"
							name="passwordConfirm">
					</div>
					<p class="form-error" hidden th:if="${errorMessage}"
						th:attr="hidden=${errorMessage} ? null : 'hidden'" th:text="${errorMessage}"
						style="color:#b52e3c;text-align:center;font-size:12px">
						入力内容を確認してください。
					</p>
					<div class="actions">
						
						<button class="btn btn-primary" type="submit">確認画面へ</button>
						<a th:href="@{/account}" class="btn btn-secondary">戻る</a>
					</div>
				</form>
			</section>
		</div>
	</main>

</body>

</html>
