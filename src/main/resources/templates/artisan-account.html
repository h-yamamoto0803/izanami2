<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>職人アカウント | Traemon</title>
<link rel="stylesheet" th:href="@{/css/styles.css}" href="../static/css/styles.css">
<script th:src="@{/js/common.js}" src="../static/js/common.js" defer></script>
</head>
<body>
<div th:replace="~{fragments/header :: header}">
<header class="site-header artisan-header">
  <div class="container header-inner">
    <a class="logo" href="artisan-menu.html">Traemon</a>
    <div class="header-right">
      <span class="role-badge artisan"><span class="role-dot"></span>職人</span>
      <a class="header-post artisan-post" href="post-create.html">＋ 投稿する</a>
      <div class="notification-wrap"><button class="icon-btn" type="button" aria-label="通知">🔔</button></div>
      <a class="account-btn" href="artisan-account.html">山田工房</a>
      <button class="logout-btn" type="button">ログアウト</button>
    </div>
  </div>
</header>
</div>
<main><div class="container"><section class="card account-head artisan-tile"><h1 class="page-title">職人アカウントページ</h1><p>自分が投稿したコメントの一覧を確認できます。</p><p class="account-name" th:text="'名前：' + ${session.userName}">名前：職人ユーザー</p><p class="account-email" th:text="'メールアドレス：' + ${session.email}">メールアドレス：artisan@example.com</p></section><div class="section-title"><h2>自分の投稿</h2></div>
<div class="timeline">
  <div class="card empty" hidden th:if="${myPosts == null or #lists.isEmpty(myPosts)}" th:attr="hidden=${myPosts == null or #lists.isEmpty(myPosts)} ? null : 'hidden'">まだ投稿がありません。<br><a class="btn btn-primary" style="margin-top:12px" th:href="@{/posts/create}">投稿を作成する</a></div>
  <div th:each="post : ${myPosts}" th:replace="~{fragments/post-card :: postCard(${post})}"><article class="card post-card post-list-card">
  <div class="post-top"><div><div class="post-author"><span class="role-badge artisan"><span class="role-dot"></span>職人</span><span class="post-user">山田工房</span></div><div class="post-date">2026/08/18 09:30</div></div></div>
  <a class="post-title-link" href="post-detail.html">暮らしに馴染む一点ものの器</a>
  <p class="post-summary">暮らしに馴染む一点ものの器を制作しています。色やサイズの相談もできます。</p>
  <div class="post-tags"><span class="tag">#陶芸</span><span class="tag">#器</span></div>
  <div class="post-actions"><span class="like-count">♥ 12 いいね</span></div>
</article></div>
</div></div></main>
</body>
</html>
