<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ユーザーアカウント登録確認 | Traemon</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="site-header guest-header">
  <div class="container header-inner">
    <a class="logo" href="menu.html">Traemon</a>
    <div class="header-right">
      <span class="role-badge guest"><span class="role-dot"></span>ゲスト</span>
      <a class="header-post guest-post" href="post-create-guest.html">＋ 投稿する</a>
      <a class="header-login artisan-login" href="artisan-login.html">職人用ログイン</a>
      <a class="header-login customer-login" href="customer-login.html">ユーザー用ログイン</a>
    </div>
  </div>
</header>
<main><div class="container"><section>
  <h1 class="page-title">ユーザーアカウント登録確認</h1>
  <div class="card form-card">
	<form id="insertForm" th:object="${insertCustomerForm}">

	    <div class="form-group">
	        <label>名前</label>
	        <input
	            class="readOnly"
	            th:field="*{userName}"
	            readonly
	            type="text">
	    </div>

	    <div class="form-group">
	        <label>メールアドレス</label>
	        <input
	            class="readOnly"
	            th:field="*{email}"
	            readonly
	            type="email">
	    </div>

		<div class="form-group">
		    <label>パスワード</label>

		    <!-- 表示用 -->
		    <input
		        class="readOnly"
		        value="********"
		        readonly
		        type="text">

		    <!-- 送信用 -->
		    <input
		        type="hidden"
		        name="password"
		        th:value="*{password}">
		</div>

		<div class="actions">


		    <button type="button" id="registerButton" class="btn btn-primary">
		        登録確定
		    </button>
			<button type="button" id="backButton" class="btn btn-secondary">
			    戻る
			</button>
		</div>
	</form>
  </div>
</section></div></main>

<script type="text/javascript">

document.getElementById("registerButton").addEventListener("click", async () => {

    const form = document.getElementById("insertForm");
    const formData = new FormData(form);

    const response = await fetch("insertCustomer", {
        method: "POST",
        body: formData
    });

    const result = await response.json();

    if (result) {

        const messageBox = document.createElement("div");
        messageBox.textContent = "登録が完了しました。";

        Object.assign(messageBox.style, {
            position: "fixed",
            top: "50%",
            left: "50%",
            transform: "translate(-50%, -50%)",
            width: "400px",
            padding: "30px",
            backgroundColor: "white",
            border: "1px solid #ccc",
            borderRadius: "8px",
            textAlign: "center",
            zIndex: "1000"
        });

        document.body.appendChild(messageBox);

        setTimeout(() => {
            window.location.href = "/customer/login";
        }, 2000);

		} else {
			alert("登録に失敗しました。");

			const transitionForm = document.createElement("form");

			transitionForm.method = "POST";
			transitionForm.action = "insertCustomerInput";

			document.body.appendChild(transitionForm);

			transitionForm.submit();
		}

});

document.getElementById("backButton").addEventListener("click", () => {

    const form = document.getElementById("insertForm");

    form.method = "POST";
    form.action = "/insertCustomerInput";
    form.submit();

});

</script>


</body>
</html>
