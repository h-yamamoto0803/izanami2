<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投稿詳細 | Traemon</title>
<link rel="stylesheet" th:href="@{/css/styles.css}" href="../static/css/styles.css">
<script th:src="@{/js/common.js}" src="../static/js/common.js" defer></script>
</head>
<body>
<div th:replace="~{fragments/header :: header}">
<header class="site-header customer-header">
  <div class="container header-inner">
    <a class="logo" href="customer-menu.html">Traemon</a>
    <div class="header-right">
      <span class="role-badge customer"><span class="role-dot"></span>ユーザー</span>
      <a class="header-post customer-post" href="post-create.html">＋ 投稿する</a>
      <div class="notification-wrap"><button class="icon-btn" type="button" aria-label="通知">🔔</button></div>
      <a class="account-btn" href="customer-account.html">伝統工芸が好き</a>
      <button class="logout-btn" type="button">ログアウト</button>
    </div>
  </div>
</header>
</div>
<main><div class="container"><section>
<h1 class="page-title">投稿詳細</h1><p class="page-subtitle">投稿の内容を詳しく確認できます。</p>
<article class="card detail-card" th:if="${post != null}">
  <div class="post-top"><div><div class="post-author"><span class="role-badge" th:classappend="${post.userType == 'artisan'} ? ' artisan' : ' customer'"><span class="role-dot"></span><span th:text="${post.userType == 'artisan'} ? '職人' : 'ユーザー'">ユーザー</span></span><span class="post-user" th:text="${post.userName}">伝統工芸が好き</span></div><div class="post-date" th:text="${post.createdAt}">2026/08/19 12:00</div></div></div>
  <h1 class="detail-title" th:text="${post.postTitle}">玄関に置ける小さな花器が欲しい</h1>
  <div class="detail-body" th:text="${post.postText}">玄関に置ける小さな花器を探しています。落ち着いた色味で、長く使えるものが希望です。</div>
  <div class="post-tags"><span class="tag" th:each="tag : ${post.tags}" th:text="'#' + ${tag}">#陶芸</span></div>
  <div class="post-actions">
    <div class="like-count" th:text="'♥ ' + ${post.favorites} + ' いいね'">♥ 21 いいね</div>
    <form th:if="${session.userType == 'customer'}" th:action="@{/posts/{id}/like(id=${post.id})}" method="post"><button class="btn btn-outline btn-like" type="submit" th:classappend="${post.favorited} ? ' active'" th:text="${post.favorited} ? '♥ いいね済み ' + ${post.favorites} : '♥ いいね ' + ${post.favorites}">♥ いいね 21</button></form>
    <form th:if="${session.userType == 'artisan'}" th:action="@{/posts/{id}/condidate(id=${post.id})}" method="post"><button class="btn btn-outline btn-condidate" type="submit" th:classappend="${post.condidate} ? ' active'" th:text="${post.condidate} ? '✓ 検討中' : '検討中'">検討中</button></form>
    <a th:if="${session.userType == null or session.userType == 'gest'}" class="btn btn-outline btn-like" th:href="@{/customer/login}" href="customer-login.html">♥ いいね</a>
  </div>
</article>
<div class="card empty" hidden th:if="${post == null}" th:attr="hidden=${post == null} ? null : 'hidden'">投稿が見つかりません。</div>
<div class="actions"><a class="btn btn-secondary" th:href="${session.userType == 'artisan'} ? @{/artisan/menu} : (${session.userType == 'customer'} ? @{/customer/menu} : @{/menu})" href="menu.html">戻る</a></div>
</section></div></main>
</body>
</html>
