<!doctype html>

<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>投稿詳細 | Traemon</title>

	<link rel="stylesheet" th:href="@{/css/styles.css}">

	<script th:src="@{/js/common.js}" defer>
	</script>
</head>

<body>

	<div th:replace="~{fragments/header :: header}">
	</div>

	<main>

		<div class="container">

			<section>

				<h1 class="page-title">
					投稿詳細
				</h1>

				<p class="page-subtitle">
					投稿の内容を詳しく確認できます。
				</p>


				<!-- ==================== -->
				<!-- 投稿詳細 -->
				<!-- ==================== -->

				<article class="card detail-card" th:object="${postDetailForm}">


					<!-- 投稿者情報 -->

					<div class="post-top">

						<div>

							<div class="post-author">

								<div th:switch="${postDetailForm.userType}">

									<span class="role-badge customer" th:case="1">

										<span class="role-dot">
										</span>

										ユーザー

									</span>


									<span class="role-badge artisan" th:case="2">

										<span class="role-dot">
										</span>

										職人

									</span>

								</div>


								<span class="post-user" th:text="*{userName}">

									ユーザー名

								</span>

							</div>


							<div class="post-date" th:text="*{#dates.format(postTime, 'yyyy/MM/dd HH:mm')}">
							</div>

						</div>

					</div>


					<!-- 投稿タイトル -->

					<h1 class="detail-title" th:text="*{postTitle}">

						投稿タイトル

					</h1>


					<!-- 投稿本文 -->

					<div class="detail-body" th:text="*{postText}">

						投稿本文

					</div>


					<!-- タグ -->

					<div class="post-tags">

						<span class="tag" th:each="tag : *{tags}" th:text="|#${tag}|">
						</span>

					</div>


					<!-- ==================== -->
					<!-- いいね・検討 -->
					<!-- ==================== -->

					<div class="post-actions">

						<div>

							<span class="favorite-count" th:text="|いいね: *{favoriteCount}|">
							</span>

							<span class="candidate-count" th:text="|検討: *{candidateCount}|">
							</span>

						</div>


						<!-- 未ログイン：いいね -->

						<button th:if="${session.loginUser == null}" id="fav-button-logout"
							class="btn btn-outline btn-favorite" type="button" th:text="|♥ いいね *{favoriteCount}|">
						</button>


						<!-- ユーザー：いいね -->

						<button th:if="${session.loginUser != null and session.loginUser.userType == 1}"
							id="favorite-button" class="btn btn-outline btn-favorite"
							th:classappend="*{favorited} ? 'is-favorited' : ''" th:data-post-id="*{postId}"
							type="button" th:text="|♥ いいね *{favoriteCount}|">
						</button>


						<!-- 職人：検討 -->

						<button th:if="${session.loginUser != null and session.loginUser.userType == 2}"
							id="candidate-button" class="btn btn-outline btn-candidate"
							th:classappend="*{candidated} ? 'is-candidated' : ''" th:data-post-id="*{postId}"
							type="button" th:text="|検討 *{candidateCount}|">
						</button>

					</div>


					<!-- ==================== -->
					<!-- コメント -->
					<!-- ==================== -->

					<section id="comments" class="comment-section">

						<h2 class="section-title">
							コメント
						</h2>


						<!-- 処理結果メッセージ -->

						<p th:if="${message != null}" class="success-message" th:text="${message}">
						</p>


						<!-- エラーメッセージ -->

						<p th:if="${errorMessage != null}" class="error-message" th:text="${errorMessage}">
						</p>


						<!-- ==================== -->
						<!-- コメント一覧 -->
						<!-- ==================== -->

						<div class="comment-list">

							<div class="comment-card" th:each="thread : ${threadList}"
								th:data-thread-id="${thread.threadId}">


								<!-- コメントヘッダー -->

								<div class="comment-header">

									<span class="comment-author" th:text="${thread.userName}">

										ユーザー名

									</span>


									<span class="comment-date"
										th:text="${#dates.format(thread.createdAt, 'yyyy/MM/dd HH:mm')}">

										2026/09/09 10:00

									</span>

								</div>


								<!-- ==================== -->
								<!-- コメント本文 -->
								<!-- ==================== -->

								<p class="comment-text" th:text="${thread.comment}">

									コメント本文

								</p>


								<!-- ==================== -->
								<!-- 自分のコメント -->
								<!-- ==================== -->

								<div class="comment-actions" th:if="${thread.ownComment}">


									<!-- 編集 -->

									<button class="comment-edit-button" type="button"
										th:data-thread-id="${thread.threadId}" th:data-post-id="${thread.postId}">

										編集

									</button>


									<!-- 削除 -->

									<form th:action="@{/thread/delete}" method="post" class="comment-delete-form">

										<input type="hidden" name="threadId" th:value="${thread.threadId}">

										<input type="hidden" name="postId" th:value="${thread.postId}">


										<button class="comment-delete-button" type="submit"
											onclick="return confirm('本当に削除しますか？');">

											削除

										</button>

									</form>

								</div>

							</div>

						</div>


						<!-- ==================== -->
						<!-- コメント新規投稿 -->
						<!-- ==================== -->

						<div class="comment-form">

							<form th:action="@{/thread}" method="post" th:object="${threadForm}" id="comment-form">


								<!-- コメント本文 -->

								<textarea class="comment-input" th:field="*{comment}" rows="4">
                            </textarea>


								<!-- 新規投稿時のバリデーションエラー -->

								<p th:if="${#fields.hasErrors('comment')}" class="error-message" th:errors="*{comment}">
								</p>


								<!-- 投稿ID -->

								<input type="hidden" th:field="*{postId}">


								<div class="actions">


									<!-- 未ログイン時 -->

									<button th:if="${session.loginUser == null}" id="comment-button-logout"
										class="btn btn-primary" type="button">

										コメントを投稿

									</button>


									<!-- ログイン済み -->

									<button th:if="${session.loginUser != null}" id="comment-button"
										class="btn btn-primary" type="submit">

										コメントを投稿

									</button>

								</div>

							</form>

						</div>

					</section>

				</article>


				<!-- 戻る -->

				<div class="actions">

					<a class="btn btn-secondary" th:href="@{/menu}">

						戻る

					</a>

				</div>

			</section>

		</div>


		<!-- ==================== -->
		<!-- ログインモーダル -->
		<!-- ==================== -->

		<div id="loginModal" hidden>

			<form class="card form-card login-popup" th:action="@{/customer/login}" th:object="${loginForm}"
				method="post">


				<p>
					ログインして好きな投稿にいいねしよう！
				</p>


				<div class="form-group">

					<label for="customerEmail">
						メールアドレス
					</label>

					<input id="customerEmail" type="email" th:field="*{email}">

					<p th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
					</p>

				</div>


				<div class="form-group">

					<label for="customerPassword">
						パスワード
					</label>

					<input id="customerPassword" type="password" th:field="*{password}">

					<p th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
					</p>

				</div>


				<div class="actions">

					<button class="btn btn-primary" type="submit">

						ログイン

					</button>


					<a class="btn btn-outline" th:href="@{/insertCustomerInput}">

						新規登録

					</a>

				</div>

			</form>

		</div>

	</main>


	<script>

		/* ==================================================
		 * いいね・ログインモーダル
		 * ================================================== */

		const favoriteButtonLogout =
			document.getElementById(
				"fav-button-logout"
			);

		const commentButtonLogout =
			document.getElementById(
				"comment-button-logout"
			);

		const loginModal =
			document.getElementById(
				"loginModal"
			);


		/* ==================================================
		 * ログインモーダル表示
		 * ================================================== */

		if (loginModal != null) {

			loginModal.addEventListener(
				"click",
				(e) => {

					if (e.target === loginModal) {

						loginModal.hidden = true;

					}

				}
			);

		}


		/* ==================================================
		 * 未ログイン：いいね
		 * ================================================== */

		if (favoriteButtonLogout != null) {

			favoriteButtonLogout.addEventListener(
				"click",
				() => {

					loginModal.hidden = false;

				}
			);

		}


		/* ==================================================
		 * 未ログイン：コメント投稿
		 * ================================================== */

		if (commentButtonLogout != null) {

			commentButtonLogout.addEventListener(
				"click",
				() => {

					loginModal.hidden = false;

				}
			);

		}


		/* ==================================================
		 * いいね
		 * ================================================== */

		const favoriteButton =
			document.getElementById(
				"favorite-button"
			);


		if (favoriteButton != null) {

			favoriteButton.addEventListener(
				"click",
				async () => {

					const formData =
						new FormData();

					formData.append(
						"postId",
						favoriteButton.dataset.postId
					);


					const response =
						await fetch(
							"/favorite",
							{
								method: "POST",
								body: formData
							}
						);


					const result =
						await response.json();


					if (result.favorited) {

						favoriteButton.classList.add(
							"is-favorited"
						);

					} else {

						favoriteButton.classList.remove(
							"is-favorited"
						);

					}


					document.querySelector(
						".favorite-count"
					).textContent =
						`いいね: ${result.favoriteCount}`;


					favoriteButton.textContent =
						`♥ いいね ${result.favoriteCount}`;

				}
			);

		}


		/* ==================================================
		 * 検討
		 * ================================================== */

		const candidateButton =
			document.getElementById(
				"candidate-button"
			);


		if (candidateButton != null) {

			candidateButton.addEventListener(
				"click",
				async () => {

					const formData =
						new FormData();

					formData.append(
						"postId",
						candidateButton.dataset.postId
					);


					const response =
						await fetch(
							"/candidate",
							{
								method: "POST",
								body: formData
							}
						);


					const result =
						await response.json();


					if (result.candidated) {

						candidateButton.classList.add(
							"is-candidated"
						);

					} else {

						candidateButton.classList.remove(
							"is-candidated"
						);

					}


					document.querySelector(
						".candidate-count"
					).textContent =
						`検討: ${result.candidateCount}`;


					candidateButton.textContent =
						`検討 ${result.candidateCount}`;

				}
			);

		}


		/* ==================================================
		 * コメント編集
		 *
		 * JavaScriptではコメント入力チェックを行わない。
		 *
		 * 編集時も通常のフォームPOSTで
		 * /thread/updateへ送信する。
		 *
		 * バリデーションはThreadFormの
		 *
		 * @NotBlank
		 * @Size(max = 1000)
		 *
		 * をSpring Validationで行う。
		 * ================================================== */

		const editButtons =
			document.querySelectorAll(
				".comment-edit-button"
			);


		editButtons.forEach(
			(editButton) => {

				editButton.addEventListener(
					"click",
					() => {


						/* ==========================
						 * コメントカード
						 * ========================== */

						const commentCard =
							editButton.closest(
								".comment-card"
							);


						/* ==========================
						 * コメントID
						 * ========================== */

						const threadId =
							editButton.dataset.threadId;


						/* ==========================
						 * 投稿ID
						 * ========================== */

						const postId =
							editButton.dataset.postId;


						/* ==========================
						 * コメント本文
						 * ========================== */

						const commentText =
							commentCard.querySelector(
								".comment-text"
							);


						const originalText =
							commentText.textContent.trim();


						/* ==========================
						 * 編集フォーム作成
						 * ========================== */

						const form =
							document.createElement(
								"form"
							);


						form.method =
							"post";


						form.action =
							"/thread/update";


						/* ==========================
						 * コメントID
						 * ========================== */

						const threadIdInput =
							document.createElement(
								"input"
							);


						threadIdInput.type =
							"hidden";


						threadIdInput.name =
							"threadId";


						threadIdInput.value =
							threadId;


						/* ==========================
						 * 投稿ID
						 * ========================== */

						const postIdInput =
							document.createElement(
								"input"
							);


						postIdInput.type =
							"hidden";


						postIdInput.name =
							"postId";


						postIdInput.value =
							postId;


						/* ==========================
						 * コメント本文
						 * ========================== */

						const input =
							document.createElement(
								"textarea"
							);


						input.className =
							"comment-input";


						input.rows =
							4;


						input.name =
							"comment";


						input.value =
							originalText;


						/* ==========================
						 * 保存ボタン
						 * ========================== */

						const saveButton =
							document.createElement(
								"button"
							);


						saveButton.className =
							"comment-edit-button";


						saveButton.type =
							"submit";


						saveButton.textContent =
							"保存";


						/* ==========================
						 * キャンセルボタン
						 * ========================== */

						const cancelButton =
							document.createElement(
								"button"
							);


						cancelButton.className =
							"comment-delete-button";


						cancelButton.type =
							"button";


						cancelButton.textContent =
							"キャンセル";


						/* ==========================
						 * 本文をフォームへ変更
						 * ========================== */

						commentText.replaceWith(
							form
						);


						form.appendChild(
							threadIdInput
						);


						form.appendChild(
							postIdInput
						);


						form.appendChild(
							input
						);


						/* ==========================
						 * ボタン
						 * ========================== */

						const actions =
							document.createElement(
								"div"
							);


						actions.className =
							"comment-actions";


						actions.appendChild(
							saveButton
						);


						actions.appendChild(
							cancelButton
						);


						form.appendChild(
							actions
						);


						/* ==========================
						 * 編集ボタン非表示
						 * ========================== */

						editButton.style.display =
							"none";


						/* ==========================
						 * 削除フォーム非表示
						 * ========================== */

						const deleteForm =
							commentCard.querySelector(
								".comment-delete-form"
							);


						if (deleteForm != null) {

							deleteForm.style.display =
								"none";

						}


						/* ==========================
						 * キャンセル
						 * ========================== */

						cancelButton.addEventListener(
							"click",
							() => {

								form.replaceWith(
									commentText
								);


								editButton.style.display =
									"";


								if (deleteForm != null) {

									deleteForm.style.display =
										"";

								}

							}
						);

					}
				);

			}
		);

	</script>

</body>

</html>
