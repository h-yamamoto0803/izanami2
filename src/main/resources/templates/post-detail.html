<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投稿詳細（職人用） | Traemon</title>
<link rel="stylesheet" href="../css/styles.css">
<script src="../js/common.js" defer></script>
</head>
<body>
<div id="header"></div>
<main>
<div class="container">
<section>
  <h1 class="page-title">投稿詳細</h1>
  <p class="page-subtitle">職人向けの投稿詳細です。内容を確認して、気になる投稿を「検討中」にできます。</p>
  <div id="postDetail"></div>
  <div class="actions">
    <button class="btn btn-secondary" onclick="history.back()">戻る</button>
  </div>
</section>
</div>
</main>
<script>
document.addEventListener("DOMContentLoaded",()=>{
  if(!Traemon.requireLogin("craftsman")) return;
  Traemon.renderPostDetail("#postDetail","craftsman");
});
</script>
</body>
</html>
