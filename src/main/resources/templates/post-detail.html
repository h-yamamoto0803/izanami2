<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>投稿詳細 | Traemon</title>
	<link rel="stylesheet" th:href="@{css/styles.css}">
	<script th:src="@{/js/common.js}" defer></script>
</head>

<body>
	<div th:replace="~{fragments/header :: header}"></div>
	<main>
		<div class="container">
			<section>
				<h1 class="page-title">投稿詳細</h1>
				<p class="page-subtitle">投稿の内容を詳しく確認できます。</p>
				<article class="card detail-card" th:object="${postDetailForm}">
					<div class="post-top">
						<div>
							<div class="post-author"><span class="role-badge customer"><span class="role-dot"></span>
									<div th:text="
											*{userType == 'artisan'}
												? '職人'
												: 'ユーザー'
											"></div></span><span class="post-user" th:text="*{userName}"></span></div>
							<div class="post-date" th:text="*{#dates.format(postTime, 'yyyy/MM/dd HH:mm')}">
							</div>
						</div>
					</div>
					<h1 class="detail-title" th:text="*{postTitle}"></h1>
					<div class="detail-body" th:text="*{postText}"></div>
					<div class="post-tags">
						<span class="tag" th:each="tag : *{tags}" th:text="|#${tag}|">
						</span>
					</div>
					<div class="post-actions">
						<div class="favorite-count" th:text="|♥ *{favoriteCount} いいね|">
						</div>

						<button class="btn btn-outline btn-favorite" type="button" th:text="|♥ いいね *{favoriteCount}|">
						</button>
					</div>
				</article>
				<div class="actions"><a class="btn btn-secondary" href="customer-menu.html">戻る</a></div>
			</section>
		</div>
	</main>
</body>

</html>
