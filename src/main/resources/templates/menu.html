<!doctype html>
<html lang="ja"xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メニューページ | Traemon</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header class="site-header guest-header">
  <div class="container header-inner">
    <a class="logo" th:href="@{/menu}">Traemon</a>
    <div class="header-right">
      <span class="role-badge guest"><span class="role-dot"></span>ゲスト</span>
      <a class="header-post guest-post" href="post-create-guest.html">＋ 投稿する</a>
	  <a class="header-login artisan-login"
	     th:href="@{/artisan/login}">職人用ログイン</a>

		 <a class="header-login customer-login"
		    th:href="@{/customer/login}">ユーザー用ログイン</a>
    </div>
  </div>
</header>
<main>
  <div class="container">
    <section class="hero">
      <h1>Traemon</h1>
      <p>職人の技術と、ユーザーの「こんなのが欲しい」をつなぐ伝統工芸コミュニティ。</p>
    </section>
    <form class="toolbar" action="menu.html" method="get">
      <select name="tag" aria-label="タグ">
        <option value="">すべてのタグ</option><option>陶芸</option><option>漆器</option><option>木工</option><option>染織</option><option>金工</option>
      </select>
      <button class="btn btn-primary" type="submit">絞り込み</button>
      <a class="btn btn-outline" href="menu.html">クリア</a>
    </form>
	<div class="timeline">

	    <article class="card post-card post-list-card"
	             th:each="post : ${posts}">

	        <div class="post-top">
	            <div>

	                <div class="post-author">

	                    <!-- Customer -->
	                    <span class="role-badge customer"
	                          th:if="${post.userType == 'customer'}">
	                        <span class="role-dot"></span>
	                        ユーザー
	                    </span>

	                    <!-- Artisan -->
	                    <span class="role-badge artisan"
	                          th:if="${post.userType == 'artisan'}">
	                        <span class="role-dot"></span>
	                        職人
	                    </span>

	                    <span class="post-user"
	                          th:text="${post.userName}">
	                        投稿者名
	                    </span>

	                </div>

	                <div class="post-date"
	                     th:text="${post.postDate}">
	                    投稿日時
	                </div>

	            </div>
	        </div>

	        <!-- 投稿タイトル -->
	        <a class="post-title-link"
	           href="#"
	           th:text="${post.title}">
	            投稿タイトル
	        </a>

	        <!-- 投稿本文 -->
	        <p class="post-summary"
	           th:text="${post.summary}">
	            投稿本文
	        </p>

	        <!-- ジャンル・タグ -->
	        <div class="post-tags">

	            <span class="tag"
	                  th:text="'#' + ${post.genre}">
	                #ジャンル
	            </span>

	            <span class="tag"
	                  th:text="'#' + ${post.tag}">
	                #タグ
	            </span>

	        </div>

	        <!-- いいね -->
	        <div class="post-actions">

	            <span class="favorite-count"
	                  th:text="'♥ ' + ${post.favoriteCount} + ' いいね'">
	                ♥ 0 いいね
	            </span>

	            <a class="btn btn-outline btn-favorite"
	               th:href="@{/customer/login}"
	               th:text="'♥ いいね ' + ${post.favoriteCount}">
	                ♥ いいね
	            </a>

	        </div>

	    </article>

	</div>
  
</main>
</body>
</html>
