<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>メニューページ | Traemon</title>

  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <script th:src="@{/js/common.js}" defer></script>
</head>


<body th:with="
    loginUser=${session.loginUser},
    userType=${
        loginUser == null
            ? 'guest'
            : (loginUser.artisan
                ? 'artisan'
                : 'customer')
    }
">


<!-- =========================
     共通ヘッダー
========================= -->

<div th:replace="~{fragments/header :: header}"></div>


<main>

  <div class="container">


    <!-- =========================
         ヒーロー
    ========================= -->

    <!-- Guest -->
    <section class="hero"
             th:if="${userType == 'guest'}">

      <h1>Traemon</h1>

      <p>
        職人の技術と、ユーザーの「こんなのが欲しい」をつなぐ伝統工芸コミュニティ。
      </p>

    </section>


    <!-- Artisan -->
    <section class="hero artisan-tile"
             th:if="${userType == 'artisan'}">

      <h1>職人専用メニュー</h1>

      <p>
        職人向けのカテゴリを中心に、ユーザーからの需要を確認できます。
      </p>

    </section>


    <!-- Customer -->
    <section class="hero customer-tile"
             th:if="${userType == 'customer'}">

      <h1>ユーザー専用メニュー</h1>

      <p>
        職人の作品や、ほかのユーザーが投稿した需要をチェックできます。
      </p>

    </section>

	<div th:if="${deleteMessage} != null">
		<span th:text="${deleteMessage}"></span>
	</div>
    <!-- =========================
         タグ絞り込み
    ========================= -->

    <form class="toolbar"
          th:action="@{/menu}"
          method="get">

      <select name="tag"
              aria-label="タグ">

        <option value=""
                th:selected="${selectedTag == null or selectedTag == ''}">
          すべてのタグ
        </option>


        <option th:each="tag : ${tags}"
                th:value="${tag}"
                th:text="${tag}"
                th:selected="${selectedTag == tag}">
          タグ名
        </option>

      </select>


      <button class="btn btn-primary"
              type="submit">
        絞り込み
      </button>


      <a class="btn btn-outline"
         th:href="@{/menu}">
        クリア
      </a>

    </form>


    <!-- =========================
         Artisan専用
         専門タグ
    ========================= -->

	

	<div class="specialty-note"
	     th:if="${userType == 'artisan'}">

	  <span class="specialty-label">
	    あなたの専門タグ
	  </span>

	  <div class="post-tags">

		<span class="tag"
		      th:each="tag : ${tags}"
		      th:text="'#' + ${tag}">
		    #タグ
		</span>

	  </div>

	</div>

    <!-- =========================
         投稿一覧
    ========================= -->

    <div class="timeline">


      <article class="card post-card post-list-card"
               th:each="post : ${posts}">


        <!-- 投稿者 -->
        <div class="post-top">

          <div>

            <div class="post-author">


              <!-- Customer -->

              <span class="role-badge customer"
                    th:if="${post.userType == '1'}">

                <span class="role-dot"></span>
                ユーザー

              </span>


              <!-- Artisan -->

              <span class="role-badge artisan"
                    th:if="${post.userType == '2'}">

                <span class="role-dot"></span>
                職人

              </span>


              <span class="post-user"
                    th:text="${post.userName}">
                投稿者名
              </span>

            </div>


            <div class="post-date"
                 th:text="${post.postDate}">
              投稿日時
            </div>

          </div>

        </div>


        <!-- 投稿タイトル -->

		<a class="post-title-link"
		   th:href="@{/postDetail?postId={postId}(postId=${post.postId})}"
		   th:text="${post.title}">

		    投稿タイトル

		</a>


        <!-- 投稿本文 -->

        <p class="post-summary"
           th:text="${post.summary}">

          投稿本文

        </p>


        <!-- 投稿タグ -->

        <div class="post-tags">

          <span class="tag"
                th:each="tag : ${post.tags}"
                th:text="'#' + ${tag}">

            #タグ

          </span>

        </div>


        <!-- =========================
             いいね・アクション
        ========================= -->

		<div class="post-actions">

		  <!-- いいね数 -->

		  <span class="favorite-count"
		        th:text="'♥ ' + ${post.favoriteCount} + ' いいね'">

		    ♥ 0 いいね

		  </span>


		  <!-- Guest -->

		  <form th:if="${session.loginUser == null}"
		        th:action="@{/customer/login}"
		        method="get">

		    <button class="btn btn-outline btn-favorite"
		            type="submit"
		            th:text="'♥ いいね ' + ${post.favoriteCount}">

		      ♥ いいね

		    </button>

		  </form>



		  <button th:if="${session.loginUser != null and session.loginUser.userType == 1}"
		          class="btn btn-outline btn-favorite favorite-button"
		          th:classappend="${post.favorited} ? 'is-favorited' : ''"
		          th:data-post-id="${post.postId}"
		          type="button"
		          th:text="'♥ いいね ' + ${post.favoriteCount}">

		    ♥ いいね

		  </button>


		  <!-- Artisan -->

		  <button th:if="${session.loginUser != null and session.loginUser.userType == 2}"
		          class="btn btn-outline btn-candidate candidate-button"
		          th:classappend="${post.candidated} ? 'is-candidated' : ''"
		          th:data-post-id="${post.postId}"
		          type="button">

		    検討

		  </button>

		</div>
        <div class="post-actions">


          <!-- いいね数 -->

          <span class="favorite-count"
                th:text="'♥ ' + ${post.favoriteCount} + ' いいね'">

            ♥ 0 いいね

          </span>


          <!-- Guest / Customer -->

          <a class="btn btn-outline btn-favorite"
             th:if="${userType == 'guest' or userType == 'customer'}"
             th:href="@{/customer/login}"
             th:text="'♥ いいね ' + ${post.favoriteCount}">

            ♥ いいね

          </a>


          <!-- Artisan -->

          <button class="btn btn-outline btn-candidate"
                  th:if="${userType == 'artisan'}"
                  type="button">

            検討中

          </button>


        </div>

      </article>

    </div>


  </div>

</main>

<Script>

	// いいねボタン処理

	const favoriteButtons = document.querySelectorAll(".favorite-button");

	favoriteButtons.forEach((favoriteButton) => {

		favoriteButton.addEventListener("click", async () => {

			const formData = new FormData();

			formData.append("postId", favoriteButton.dataset.postId);

			const response = await fetch("/favorite", {

				method: "POST",

				body: formData

			});

			const result = await response.json();

			if (result.favorited) {

				favoriteButton.classList.add("is-favorited");

			} else {

				favoriteButton.classList.remove("is-favorited");

			}

			const postCard = favoriteButton.closest(".post-list-card");

			postCard.querySelector(".favorite-count").textContent

				= `♥ ${result.favoriteCount} いいね`;

			favoriteButton.textContent

				= `♥ いいね ${result.favoriteCount}`;

		});

	});


	// 検討ボタン処理

	const candidateButtons = document.querySelectorAll(".candidate-button");

	candidateButtons.forEach((candidateButton) => {

		candidateButton.addEventListener("click", async () => {

			const formData = new FormData();

			formData.append("postId", candidateButton.dataset.postId);

			const response = await fetch("/candidate", {

				method: "POST",

				body: formData

			});

			const result = await response.json();

			if (result.candidated) {

				candidateButton.classList.add("is-candidated");

			} else {

				candidateButton.classList.remove("is-candidated");

			}

			const postCard = candidateButton.closest(".post-list-card");

			postCard.querySelector(".candidate-count").textContent

				= `${result.candidateCount} 検討`;

			candidateButton.textContent

				= `検討 ${result.candidateCount}`;

		});

	});

</Script>

</body>
</html>
