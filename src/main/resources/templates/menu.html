<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メニューページ | Traemon</title>
<link rel="stylesheet" th:href="@{/css/styles.css}" href="../static/css/styles.css">
<script th:src="@{/js/common.js}" src="../static/js/common.js" defer></script>
</head>
<body>
<div th:replace="~{fragments/header :: header}">
<header class="site-header gest-header">
  <div class="container header-inner">
    <a class="logo" href="menu.html">Traemon</a>
    <div class="header-right">
      <span class="role-badge gest"><span class="role-dot"></span>ゲスト</span>
      <a class="header-post gest-post" href="post-create.html">＋ 投稿する</a>
      <a class="header-login artisan-login" href="artisan-login.html">職人用ログイン</a>
      <a class="header-login customer-login" href="customer-login.html">ユーザー用ログイン</a>
    </div>
  </div>
</header>
</div>
<main>
<div class="container">
  <section class="hero">
    <h1>Traemon</h1>
    <p>職人の技術と、ユーザーの「こんなのが欲しい」をつなぐ伝統工芸コミュニティ。</p>
  </section>

  <form class="toolbar" th:action="@{/menu}" method="get">
    <select name="tag" aria-label="タグ">
      <option value="">すべてのタグ</option>
      <option th:each="tag : ${tags}" th:value="${tag}" th:text="${tag}" th:selected="${tag == selectedTag}">陶芸</option>
    </select>
    <button class="btn btn-primary" type="submit">絞り込み</button>
    <a class="btn btn-outline" th:href="@{/menu}">クリア</a>
  </form>

  <div class="timeline">
    <div class="card empty" hidden th:if="${posts == null or #lists.isEmpty(posts)}" th:attr="hidden=${posts == null or #lists.isEmpty(posts)} ? null : 'hidden'">投稿がありません。</div>
    <div th:each="post : ${posts}" th:replace="~{fragments/post-card :: postCard(${post})}"><article class="card post-card post-list-card">
  <div class="post-top"><div><div class="post-author"><span class="role-badge customer"><span class="role-dot"></span>ユーザー</span><span class="post-user">伝統工芸が好き</span></div><div class="post-date">2026/08/19 12:00</div></div></div>
  <a class="post-title-link" href="post-detail.html">玄関に置ける小さな花器が欲しい</a>
  <p class="post-summary">玄関に置ける小さな花器を探しています。落ち着いた色味で、長く使えるものが希望です。</p>
  <div class="post-tags"><span class="tag">#陶芸</span><span class="tag">#花器</span></div>
  <div class="post-actions"><span class="like-count">♥ 21 いいね</span></div>
</article></div>
  </div>
</div>
</main>
</body>
</html>
