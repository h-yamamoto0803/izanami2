<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投稿詳細（ユーザー用） | Traemon</title>
<link rel="stylesheet" href="../css/styles.css">
<script src="../js/common.js" defer></script>
</head>
<body>
<div id="header"></div>
<main>
<div class="container">
<section>
  <h1 class="page-title">投稿詳細</h1>
  <p class="page-subtitle">投稿の内容を詳しく確認できます。</p>
  <div id="postDetail"></div>
  <div class="actions">
    <button class="btn btn-secondary" onclick="history.back()">戻る</button>
  </div>
</section>
</div>
</main>
<script>
document.addEventListener("DOMContentLoaded",()=>{
  const s=Traemon.getSession();
  if(s?.role === "craftsman"){
    location.href="post-detail.html" + location.search;
    return;
  }
  Traemon.renderPostDetail("#postDetail","consumer");
});
</script>
</body>
</html>
