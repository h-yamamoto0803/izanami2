<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ユーザー専用メニュー | Traemon</title>
<link rel="stylesheet" href="../css/styles.css">
<script src="../js/common.js" defer></script>
</head>
<body>
<div id="header"></div>
<main>
<div class="container">

<section class="hero customer-tile">
  <h1>ユーザー専用メニュー</h1>
  <p>職人の作品や、ほかのユーザーが投稿した需要をチェックできます。</p>
</section>


<div class="toolbar">
<select id="tagFilter"></select>
  <button id="filterButton" class="btn btn-primary" type="button">絞り込み</button>
  <button id="clearFilterButton" class="btn btn-outline" type="button">クリア</button>
</div>

<div id="postList" class="timeline"></div>


</div>
</main>
<script>
document.addEventListener("DOMContentLoaded",()=>{
  if(!Traemon.requireLogin("consumer")) return;
  Traemon.setupTimeline();
});
</script>
</body>
</html>
