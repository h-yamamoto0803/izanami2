<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ユーザー専用メニュー | Traemon</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <script th:src="@{/js/common.js}" defer></script>
</head>
<body>
<header class="site-header customer-header">
  <div class="container header-inner">
    <a class="logo" th:href="@{/menu}">Traemon</a>
    <div class="header-right">
      <span class="role-badge customer"><span class="role-dot"></span>ユーザー</span>
      <a class="header-post customer-post" href="post-create-customer.html">＋ 投稿する</a>
      <div class="notification-wrap">
        <button class="icon-btn" id="notificationButton" type="button" aria-label="通知">🔔</button>
        <div class="notification-panel" id="notificationPanel">
          <div class="notification-item">
            <div>あなたの投稿に反応がありました。</div>
            <small>2026/08/20 10:15</small>
          </div>
          <div class="notification-item">
            <div>「玄関に置ける小さな花器が欲しい」に新しい反応があります。</div>
            <small>2026/08/19 18:40</small>
          </div>
        </div>
      </div>
      <a class="account-btn" href="customer-account.html">伝統工芸が好き</a>
	  <form th:action="@{/logout}" method="post">
	      <button class="logout-btn" type="submit">ログアウト</button>
	  </form>
    </div>
  </div>
</header>
<main><div class="container">
  <section class="hero customer-tile"><h1>ユーザー専用メニュー</h1><p>職人の作品や、ほかのユーザーが投稿した需要をチェックできます。</p></section>
  <form class="toolbar" th:action="@{/menu}" method="get">

      <select name="tag">

          <!-- すべてのタグ -->
          <option value=""
                  th:selected="${selectedTag == null or selectedTag == ''}">
              すべてのタグ
          </option>

          <!-- DBから取得したタグ -->
          <option th:each="tag : ${tags}"
                  th:value="${tag}"
                  th:text="${tag}"
                  th:selected="${tag == selectedTag}">
              タグ
          </option>

      </select>

      <button class="btn btn-primary" type="submit">
          絞り込み
      </button>

      <a class="btn btn-outline"
         th:href="@{/menu}">
          クリア
      </a>

  </form>
  <div class="timeline">

      <article class="card post-card post-list-card"
               th:each="post : ${posts}">

          <div class="post-top">
              <div>

                  <div class="post-author">

                      <!-- Customer -->
                      <span class="role-badge customer"
                            th:if="${post.userType == 'customer'}">
                          <span class="role-dot"></span>
                          ユーザー
                      </span>

                      <!-- Artisan -->
                      <span class="role-badge artisan"
                            th:if="${post.userType == 'artisan'}">
                          <span class="role-dot"></span>
                          職人
                      </span>

                      <span class="post-user"
                            th:text="${post.userName}">
                          投稿者名
                      </span>

                  </div>

                  <div class="post-date"
                       th:text="${post.postDate}">
                      投稿日時
                  </div>

              </div>
          </div>

          <a class="post-title-link"
             href="#"
             th:text="${post.title}">
              投稿タイトル
          </a>

          <p class="post-summary"
             th:text="${post.summary}">
              投稿本文
          </p>

          <div class="post-tags">

              <span class="tag"
                    th:each="tag : ${post.tags}"
                    th:text="'#' + ${tag}">
                  #タグ
              </span>

          </div>

          <div class="post-actions">

              <span class="favorite-count"
                    th:text="'♥ ' + ${post.favoriteCount} + ' いいね'">
                  ♥ 0 いいね
              </span>

              <a class="btn btn-outline btn-favorite"
                 th:href="@{/customer/login}"
                 th:text="'♥ いいね ' + ${post.favoriteCount}">
                  ♥ いいね
              </a>

          </div>

      </article>

  </div>
</article></div>
</div></main>
</body>
</html>
