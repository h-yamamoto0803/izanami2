<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ポートフォリオ編集 | Traemon</title>
	<link rel="stylesheet" th:href="@{/css/styles.css}">
	<script th:src="@{/js/common.js}" defer></script>
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main>
	<div class="container">

		<section>
			<h1 class="page-title">ポートフォリオ編集ページ</h1>
			<p class="page-subtitle">
				作品画像と作品についての説明を編集してください。
			</p>

			<form class="card form-card"
			      th:action="@{/portfolio-edit-confirm}"
			      th:object="${portfolioForm}"
			      method="post"
			      enctype="multipart/form-data">

			    <!-- 編集対象ID -->
			    <input type="hidden"
			           th:field="*{portfolioId}">

			    <!-- 現在の画像パス -->
			    <input type="hidden"
			           th:field="*{tempImagePath}">

			    <!-- 現在の作品画像 -->
			    <div class="form-group">
			        <label>現在の作品画像</label>

			        <img th:src="${portfolioForm.tempImagePath}"
			             alt="現在の作品画像"
			             style="max-width:300px; width:100%; height:auto;">
			    </div>

			    <!-- 作品画像変更 -->
			    <div class="form-group">
			        <label for="portfolioImage">作品画像</label>

			        <input id="portfolioImage"
			               type="file"
			               th:field="*{image}"
			               accept="image/*">

			        <p th:if="${#fields.hasErrors('image')}"
			           th:errors="*{image}">
			        </p>
			    </div>

			    <!-- 作品説明 -->
			    <div class="form-group">
			        <label for="portfolioDescription">作品説明</label>

			        <textarea id="portfolioDescription"
			                  rows="8"
			                  th:field="*{description}">
			        </textarea>

			        <p th:if="${#fields.hasErrors('description')}"
			           th:errors="*{description}">
			        </p>
			    </div>

			    <div class="actions">

			        <button class="btn btn-primary"
			                type="submit">
			            確認画面へ
			        </button>

			        <a class="btn btn-secondary"
			           th:href="@{/account}">
			            戻る
			        </a>

			    </div>

			</form>

		</section>

	</div>
</main>

</body>
</html>
