<!doctype html>
<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ユーザーアカウント編集確認 | Traemon</title>
<link rel="stylesheet" th:href="@{css/styles.css}">
<script th:src="@{/js/common.js}" defer></script>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main><div class="container"><section>

  <h1 class="page-title">ユーザーアカウント編集確認</h1><p class="page-subtitle"></p>
  <form class="card form-card" 
    				th:action="@{/doEditCustomerAccount}" 
    				th:object="${customerAccountEditForm}"
    				method="post">
    					<div class="form-group">
    						<label for="userName">名前</label>
    						<input id="userName" type="text" required
    							maxlength="40" th:field="*{userName}" name="userName"   readonly>
    						</div>
    					<div class="form-group">
    						<label for="email">メールアドレス</label>
    						<input id="email" type="email" required
    							th:field="*{email}" name="email"  readonly>
    						</div>
    					<div class="form-group">
    						<label for="password">パスワード</label>
    						<input id="password" type="text"
    							required minlength="6" 							th:name="password"
							           th:value="${customerAccountEditForm.password}" name="password"  readonly>
    						</div>
    				
    					<div class="actions">
    						
    						<button class="btn btn-primary"
    							type="submit">編集確定</button>
								<button type="submit" 
								                th:formaction="@{/customerAccountEdit}" 
								                formmethod="get" 
								                class="btn btn-secondary">戻る</button>
    						</div>
    				</form>

</section></div></main>
</body>
</html>
