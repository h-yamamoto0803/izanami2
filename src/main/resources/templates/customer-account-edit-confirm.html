<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ユーザーアカウント編集確認 | Traemon</title>
<link rel="stylesheet" th:href="@{/css/styles.css}" href="../static/css/styles.css">
<script th:src="@{/js/common.js}" src="../static/js/common.js" defer></script>
</head>
<body>
<div th:replace="~{fragments/header :: header}">
<header class="site-header customer-header">
  <div class="container header-inner">
    <a class="logo" href="customer-menu.html">Traemon</a>
    <div class="header-right">
      <span class="role-badge customer"><span class="role-dot"></span>ユーザー</span>
      <a class="header-post customer-post" href="post-create.html">＋ 投稿する</a>
      <div class="notification-wrap"><button class="icon-btn" type="button" aria-label="通知">🔔</button></div>
      <a class="account-btn" href="customer-account.html">伝統工芸が好き</a>
      <button class="logout-btn" type="button">ログアウト</button>
    </div>
  </div>
</header>
</div>
<main><div class="container"><section>
<h1 class="page-title">ユーザーアカウント編集確認</h1><p class="page-subtitle">変更内容を確認してください。</p>
<form class="card form-card" th:action="@{/DoEditCustomerAccount}" th:object="${accountEditForm}" method="get">
  <dl class="confirm-list">
    <div class="confirm-row"><dt>名前</dt><dd th:text="*{userName}">山田 太郎</dd></div>
    <div class="confirm-row"><dt>メールアドレス</dt><dd th:text="*{email}">user@example.com</dd></div>
    <div class="confirm-row"><dt>パスワード</dt><dd>セキュリティのため非表示</dd></div>
  </dl>
  <input type="hidden" th:field="*{userName}" name="userName">
  <input type="hidden" th:field="*{email}" name="email">
  <input type="hidden" th:field="*{password}" name="password">
  <input type="hidden" th:field="*{passwordConfirm}" name="passwordConfirm">
  <div class="actions">
	<button class="btn btn-secondary" 
	type="submit" th:formaction="@{/CustomerAccountEdit}">戻る</button>
	<button class="btn btn-primary" type="submit">変更確定</button></div>
</form>
</section></div></main>
</body>
</html>
