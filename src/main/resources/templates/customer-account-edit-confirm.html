<!doctype html>
<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ユーザーアカウント編集確認 | Traemon</title>
<link rel="stylesheet" th:href="@{css/styles.css}">
<script th:src="@{/js/common.js}" defer></script>
</head>
<body>
<header class="site-header customer-header">
  <div class="container header-inner">
    <a class="logo" href="customer-menu.html">Traemon</a>
    <div class="header-right">
      <span class="role-badge customer"><span class="role-dot"></span>ユーザー</span>
      <a class="header-post customer-post" href="post-create-customer.html">＋ 投稿する</a>
      <div class="notification-wrap">
        <button class="icon-btn" id="notificationButton" type="button" aria-label="通知">🔔</button>
        <div class="notification-panel" id="notificationPanel">
          <div class="notification-item">
            <div>あなたの投稿に反応がありました。</div>
            <small>2026/08/20 10:15</small>
          </div>
          <div class="notification-item">
            <div>「玄関に置ける小さな花器が欲しい」に新しい反応があります。</div>
            <small>2026/08/19 18:40</small>
          </div>
        </div>
      </div>
      <a class="account-btn" href="customer-account.html">伝統工芸が好き</a>
      <a class="logout-btn" href="menu.html">ログアウト</a>
    </div>
  </div>
</header>
<main><div class="container"><section>

  <h1 class="page-title">ユーザーアカウント編集確認</h1><p class="page-subtitle">変更内容の静的サンプルです。</p>
  <form class="card form-card" 
    				th:action="@{/doEditCustomerAccount}" 
    				th:object="${customerAccountEditForm}"
    				method="post">
    					<div class="form-group">
    						<label for="userName">名前</label>
    						<input id="userName" type="text" required
    							maxlength="40" th:field="*{userName}" name="userName"   readonly>
    						</div>
    					<div class="form-group">
    						<label for="email">メールアドレス</label>
    						<input id="email" type="email" required
    							th:field="*{email}" name="email"  readonly>
    						</div>
    					<div class="form-group">
    						<label for="password">パスワード</label>
    						<input id="password" type="text"
    							required minlength="6" 							th:name="password"
							           th:value="${customerAccountEditForm.password}" name="password"  readonly>
    						</div>
    				
    					<div class="actions">
    						
    						<button class="btn btn-primary"
    							type="submit">編集確定</button>
								<button type="submit" 
								                th:formaction="@{/customerAccountEdit}" 
								                formmethod="get" 
								                class="btn btn-secondary">戻る</button>
    						</div>
    				</form>

</section></div></main>
</body>
</html>
