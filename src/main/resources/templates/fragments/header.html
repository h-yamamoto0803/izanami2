
<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<body>

	<!-- =========================
	     共通ヘッダー
	     userType によって
	     guest / artisan / customer
	     のメニューを切り替える
	========================== -->

	<header th:fragment="header"
			th:with="
				userType=${userType != null
					? userType
					: 'guest'}
			"
			class="site-header"
			th:classappend="
				${userType == 'artisan'}
					? ' artisan-header'
					: (${userType == 'customer'}
						? ' customer-header'
						: ' guest-header')
			">

		<div class="container header-inner">

			<!-- ロゴ -->
			<a class="logo"
			   th:href="
					${userType == 'artisan'}
						? @{/artisan/menu}
						: (${userType == 'customer'}
							? @{/customer/menu}
							: @{/menu})
			   ">
				Traemon
			</a>


			<!-- =========================
			     guest
			========================== -->

			<div class="header-right"
				 th:if="${userType == 'guest'}">

				<span class="role-badge guest">
					<span class="role-dot"></span>
					ゲスト
				</span>

				<a class="header-post guest-post"
				   th:href="@{/posts/create}">
					＋ 投稿する
				</a>

				<a class="header-login artisan-login"
				   th:href="@{/artisan/login}">
					職人用ログイン
				</a>

				<a class="header-login customer-login"
				   th:href="@{/customer/login}">
					ユーザー用ログイン
				</a>

			</div>


			<!-- =========================
			     artisan
			========================== -->

			<div class="header-right"
				 th:if="${userType == 'artisan'}">

				<span class="role-badge artisan">
					<span class="role-dot"></span>
					職人
				</span>

				<a class="header-post artisan-post"
				   th:href="@{/posts/create}">
					＋ 投稿する
				</a>


				<!-- 通知 -->
				<div class="notification-wrap">

					<button class="icon-btn"
							id="notificationButton"
							type="button"
							aria-label="通知">
						🔔
					</button>

					<div class="notification-panel"
						 id="notificationPanel">

						<div class="notification-item">

							<div>
								あなたの投稿に反応がありました。
							</div>

							<small>
								2026/08/20 10:15
							</small>

						</div>

						<div class="notification-item">

							<div>
								「玄関に置ける小さな花器が欲しい」に新しい反応があります。
							</div>

							<small>
								2026/08/19 18:40
							</small>

						</div>

					</div>

				</div>


				<!-- アカウント -->
				<a class="account-btn"
				   th:href="@{/artisan/account}"
				   th:text="${userName}">
					山田工房
				</a>


				<!-- ログアウト -->
				<form th:action="@{/logout}"
					  method="post">

					<button class="logout-btn"
							type="submit">
						ログアウト
					</button>

				</form>

			</div>


			<!-- =========================
			     customer
			========================== -->

			<div class="header-right"
				 th:if="${userType == 'customer'}">

				<span class="role-badge customer">
					<span class="role-dot"></span>
					ユーザー
				</span>

				<a class="header-post customer-post"
				   th:href="@{/posts/create}">
					＋ 投稿する
				</a>


				<!-- 通知 -->
				<div class="notification-wrap">

					<button class="icon-btn"
							id="notificationButton"
							type="button"
							aria-label="通知">
						🔔
					</button>

					<div class="notification-panel"
						 id="notificationPanel">

						<div class="notification-item">

							<div>
								あなたの投稿に反応がありました。
							</div>

							<small>
								2026/08/20 10:15
							</small>

						</div>

						<div class="notification-item">

							<div>
								「玄関に置ける小さな花器が欲しい」に新しい反応があります。
							</div>

							<small>
								2026/08/19 18:40
							</small>

						</div>

					</div>

				</div>


				<!-- アカウント -->
				<a class="account-btn"
				   th:href="@{/customer/account}"
				   th:text="${userName}">
					伝統工芸が好き
				</a>


				<!-- ログアウト -->
				<form th:action="@{/logout}"
					  method="post">

					<button class="logout-btn"
							type="submit">
						ログアウト
					</button>

				</form>

			</div>

		</div>

	</header>

</body>

</html>
