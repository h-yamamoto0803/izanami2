<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="header"
        th:with="userType=${session.userType != null ? session.userType : 'gest'}"
        class="site-header"
        th:classappend="${userType == 'artisan'} ? ' artisan-header' : (${userType == 'customer'} ? ' customer-header' : ' gest-header')">
  <div class="container header-inner">

    <a class="logo"
       th:href="${userType == 'artisan'} ? @{/artisan/menu} : (${userType == 'customer'} ? @{/customer/menu} : @{/menu})">
      Traemon
    </a>

    <!-- gest -->
    <div class="header-right" th:if="${userType == 'gest'}">
      <span class="role-badge gest"><span class="role-dot"></span>ゲスト</span>
      <a class="header-post gest-post" th:href="@{/posts/create}">＋ 投稿する</a>
      <a class="header-login artisan-login" th:href="@{/artisan/login}">職人用ログイン</a>
      <a class="header-login customer-login" th:href="@{/customer/login}">ユーザー用ログイン</a>
    </div>

    <!-- artisan -->
    <div class="header-right" th:if="${userType == 'artisan'}">
      <span class="role-badge artisan"><span class="role-dot"></span>職人</span>
      <a class="header-post artisan-post" th:href="@{/posts/create}">＋ 投稿する</a>

      <div class="notification-wrap">
        <button class="icon-btn" id="notificationButton" type="button" aria-label="通知">🔔</button>
        <div class="notification-panel" id="notificationPanel">
          <div class="notification-item" th:each="notification : ${notifications}">
            <div th:text="${notification.text}">あなたの投稿に反応がありました。</div>
            <small th:text="${notification.date}">2026/08/19</small>
          </div>
          <div class="empty" th:if="${notifications == null or #lists.isEmpty(notifications)}">通知はありません。</div>
        </div>
      </div>

      <a class="account-btn" th:href="@{/artisan/account}"
         th:text="${session.userName != null ? session.userName : '職人ユーザー'}">山田工房</a>

      <form th:action="@{/logout}" method="post">
        <button class="logout-btn" type="submit">ログアウト</button>
      </form>
    </div>

    <!-- customer -->
    <div class="header-right" th:if="${userType == 'customer'}">
      <span class="role-badge customer"><span class="role-dot"></span>ユーザー</span>
      <a class="header-post customer-post" th:href="@{/posts/create}">＋ 投稿する</a>

      <div class="notification-wrap">
        <button class="icon-btn" id="notificationButton" type="button" aria-label="通知">🔔</button>
        <div class="notification-panel" id="notificationPanel">
          <div class="notification-item" th:each="notification : ${notifications}">
            <div th:text="${notification.text}">あなたの投稿に反応がありました。</div>
            <small th:text="${notification.date}">2026/08/19</small>
          </div>
          <div class="empty" th:if="${notifications == null or #lists.isEmpty(notifications)}">通知はありません。</div>
        </div>
      </div>

      <a class="account-btn" th:href="@{/customer/account}"
         th:text="${session.userName != null ? session.userName : 'ユーザー'}">伝統工芸が好き</a>

      <form th:action="@{/logout}" method="post">
        <button class="logout-btn" type="submit">ログアウト</button>
      </form>
    </div>

  </div>
</header>

</body>
</html>
