<!-- =========================
     ヘッダーメニュー部分を構成する
	 レスポンスからuserTypeを受け取り、
	 メニューレイアウトを分岐する。
========================== -->
<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<body>

	<!--==========================================
	th:with 部分＝
		レスポンスのuserTypeがnullならguest、そうでないならその値をuserTypeへ代入
	th:classapeend 部分＝
		↑で代入したuserTypeによって、classの値を割り当てる
	ここで設定されたuserType、classappendによって、メニューレイアウトが分岐する。
	 ============================================================-->
	<header th:fragment="header" 
		th:with="userType=${session.loginUser == null
				?'guest'
				:session.loginUser.userType == 1 
					? 'customer'
					:session.loginUser.userType == 2
						? 'artisan'
						: 'guest'}"
		class="site-header" th:classappend="
	             ${userType == 'artisan'}
	                 ? ' artisan-header'
	                 : (${userType == 'customer'}
	                     ? ' customer-header'
	                     : ' guest-header')">

		<div class="container header-inner">

			<!-- ロゴ -->
			<a class="logo" th:href="@{/menu}">Traemon</a>

			<div class="header-right">

				<!-- 役割：guest / artisan / customer 共通 -->
				<span class="role-badge" th:classappend="${userType}">

					<span class="role-dot"></span>

					<span th:text="
	                     ${userType == 'artisan'}
	                         ? '職人'
	                         : (${userType == 'customer'}
	                             ? 'ユーザー'
	                             : 'ゲスト')">
					</span>

				</span>


				<!-- 投稿ボタン：guest / artisan / customer 共通 -->
				<a class="header-post" th:classappend="
	                     ${userType == 'artisan'}
	                         ? ' artisan-post'
	                         : (${userType == 'customer'}
	                             ? ' customer-post'
	                             : ' guest-post')" th:href="@{/insertPost}">
					＋ 投稿する
				</a>


				<!-- guestのみ -->
				<th:block th:if="${userType == 'guest'}">

					<a class="header-login artisan-login" th:href="@{/artisan/login}">
						職人用ログイン
					</a>

					<a class="header-login customer-login" th:href="@{/customer/login}">
						ユーザー用ログイン
					</a>

				</th:block>


				<!-- artisan / customer 共通 -->
				<th:block th:if="${userType == 'artisan' or userType == 'customer'}">

					<!-- 通知 -->
					<div class="notification-wrap">

						<button class="icon-btn" id="notificationButton" type="button" aria-label="通知">
							🔔
						</button>

						<div class="notification-panel" id="notificationPanel">

							<a class="notification-item" th:each="notification : ${notificationFormList}"
								th:href="@{/postDetail?postId={postId}(postId=${notification.postId})}">

								<span class="unread-mark" th:if="${!notification.isRead}">
									●
								</span>

								<div th:text="${notification.message}"></div>

								<small th:text="${#dates.format(
	                                 notification.createdAt,
	                                 'yyyy/MM/dd HH:mm'
	                             )}"></small>

							</a>

							<div class="notification-empty" th:if="${#lists.isEmpty(notificationFormList)}">
								通知はありません。
							</div>

						</div>

					</div>


					<!-- アカウント -->
					<a class="account-btn" th:href="
	                         ${userType == 'artisan'}
	                             ? @{/customerAccount}
	                             : @{/customerAccount}" th:text="${session.loginUser.userName}">
					</a>

					<!-- ログアウト -->
					<form th:action="@{/logout}" method="post">

						<button class="logout-btn" type="submit">
							ログアウト
						</button>

					</form>

				</th:block>

			</div>

		</div>

	</header>

</body>

</html>
