<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>

<article th:fragment="postCard(post)" class="card post-card post-list-card">
  <div class="post-top">
    <div>
      <div class="post-author">
        <span class="role-badge"
              th:classappend="${post.userType == 'artisan'} ? ' artisan' : ' customer'">
          <span class="role-dot"></span>
          <span th:text="${post.userType == 'artisan'} ? '職人' : 'ユーザー'">ユーザー</span>
        </span>
        <span class="post-user" th:text="${post.userName}">伝統工芸が好き</span>
      </div>
      <div class="post-date" th:text="${post.createdAt}">2026/08/19 12:00</div>
    </div>
  </div>

  <a class="post-title-link"
     th:href="@{/posts/{id}(id=${post.id})}"
     th:text="${post.postTitle}">玄関に置ける小さな花器が欲しい</a>

  <p class="post-summary"
     th:text="${post.postSummary}">玄関に置ける小さな花器を探しています。落ち着いた色味で、長く使えるものが希望です。</p>

  <div class="post-tags">
    <span class="tag" th:each="tag : ${post.tags}" th:text="'#' + ${tag}">#陶芸</span>
  </div>

  <div class="post-actions">
    <span class="like-count" th:text="'♥ ' + ${post.favorites} + ' いいね'">♥ 21 いいね</span>

    <form th:if="${session.userType == 'customer'}"
          th:action="@{/posts/{id}/like(id=${post.id})}" method="post">
      <button class="btn btn-outline btn-like" type="submit"
              th:classappend="${post.favorited} ? ' active'"
              th:text="${post.favorited} ? '♥ いいね済み ' + ${post.favorites} : '♥ いいね ' + ${post.favorites}">
        ♥ いいね 21
      </button>
    </form>

    <form th:if="${session.userType == 'artisan'}"
          th:action="@{/posts/{id}/condidate(id=${post.id})}" method="post">
      <button class="btn btn-outline btn-condidate" type="submit"
              th:classappend="${post.condidate} ? ' active'"
              th:text="${post.condidate} ? '✓ 検討中' : '検討中'">
        検討中
      </button>
    </form>

    <a th:if="${session.userType == null or session.userType == 'gest'}"
       class="btn btn-outline btn-like" th:href="@{/customer/login}">
      ♥ いいね <span th:text="${post.favorites}">21</span>
    </a>
  </div>
</article>

</body>
</html>
