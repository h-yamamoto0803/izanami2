<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>職人専用メニュー | Traemon</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <script th:src="@{/js/common.js}" defer></script>
</head>

<body>

<!-- 共通ヘッダー -->
<div th:replace="~{fragments/header :: header}"></div>

<main>
  <div class="container">

    <section class="hero artisan-tile">
      <h1>職人専用メニュー</h1>
      <p>
        職人向けのカテゴリを中心に、ユーザーからの需要を確認できます。
      </p>
    </section>
	<div th:if="${deleteMessage} != null">
	      <span th:text="${deleteMessage}"></span>
	  </div>

    <form class="toolbar"
          th:action="@{/artisan/menu}"
          method="get">

      <select name="tag" aria-label="専門タグで絞り込み">
		<option value=""
		        th:selected="${selectedTag == null or selectedTag == ''}">
		    すべてのタグ
		</option>

		<option th:each="tag : ${tags}"
		        th:value="${tag}"
		        th:text="${tag}"
		        th:selected="${tag == selectedTag}">
		</option>
      </select>

      <button class="btn btn-primary" type="submit">
        絞り込み
      </button>

      <a class="btn btn-outline"
         th:href="@{/artisan/menu}">
        クリア
      </a>

    </form>

    <div class="specialty-note">
      <span class="specialty-label">あなたの専門タグ</span>

      <div class="post-tags">
        <span class="tag">#陶芸</span>
        <span class="tag">#器</span>
        <span class="tag">#花器</span>
      </div>
    </div>

	<div class="timeline">

	  <article class="card post-card post-list-card"
	           th:each="post : ${posts}">

	    <div class="post-top">
	      <div>

	        <div class="post-author">

	          <span class="role-badge customer"
	                th:if="${post.userType == 'customer'}">
	            <span class="role-dot"></span>
	            ユーザー
	          </span>

	          <span class="role-badge artisan"
	                th:if="${post.userType == 'artisan'}">
	            <span class="role-dot"></span>
	            職人
	          </span>

	          <span class="post-user"
	                th:text="${post.userName}">
	            投稿者名
	          </span>

	        </div>

	        <div class="post-date"
	             th:text="${post.postDate}">
	          投稿日時
	        </div>

	      </div>
	    </div>

	    <a class="post-title-link"
	       th:href="@{/post-detail?postId={postId}(postId=${post.postId})}"
	       th:text="${post.title}">
	      投稿タイトル
	    </a>

	    <p class="post-summary"
	       th:text="${post.summary}">
	      投稿本文
	    </p>

	    <div class="post-tags">

	      <span class="tag"
	            th:each="tag : ${post.tags}"
	            th:text="'#' + ${tag}">
	        #タグ
	      </span>

	    </div>

	    <div class="post-actions">

	      <span class="favorite-count"
	            th:text="'♥ ' + ${post.favoriteCount} + ' いいね'">
	        ♥ 0 いいね
	      </span>

	      <button class="btn btn-outline btn-candidate"
	              type="button">
	        検討中
	      </button>

	    </div>

	  </article>

	</div>

      </article>

    </div>

  </div>
</main>

</body>
</html>
