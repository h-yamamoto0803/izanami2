<!doctype html>
<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>アカウント詳細 | Traemon</title>
	<link rel="stylesheet" th:href="@{/css/styles.css}">
	<script th:src="@{/js/common.js}" defer></script>
</head>

<body th:with="
    loginUser=${session.loginUser},
    userType=${
        loginUser == null
            ? 'guest'
            : (loginUser.artisan
                ? 'artisan'
                : 'customer')
    }
">
	<div th:replace="~{fragments/header :: header}"></div>
	

	<main>
		<div class="container">
			
				<section class="card account-head customer-tile"
							th:if="${userType == 'customer'}">
								<h1 class="page-title">ユーザーアカウントページ</h1>
								<p>自分が投稿した内容の一覧とアカウント情報を確認できます。</p>
								<div class="form-group">
									<label for="userName">名前</label>
									<span th:text="${userName}"></span>
								</div>
								<div class="form-group">
									<label for="email">メールアドレス</label>
									<span th:text="${email}"></span>
								</div>

								<div class="account-actions">
									<a class="btn btn-primary" th:href="@{/customerAccountEdit}">アカウント編集</a>
									<a class="btn btn-primary" th:href="@{/DeleteCustomerAccount}">削除</a>
								</div>
							</section>
							
							<section class="card account-head artisan-tile"
										th:if="${userType == 'artisan'}">
											<h1 class="page-title">ユーザーアカウントページ</h1>
											<p>自分が投稿した内容の一覧とアカウント情報を確認できます。</p>
											<div class="form-group">
												<label for="userName">名前</label>
												<span th:text="${userName}"></span>
											</div>
											<div class="form-group">
												<label for="email">メールアドレス</label>
												<span th:text="${email}"></span>
											</div>

											<div class="account-actions">
												<a class="btn btn-primary" th:href="@{/customerAccountEdit}">アカウント編集</a>
												<a class="btn btn-primary" th:href="@{/DeleteCustomerAccount}">削除</a>
											</div>
										</section>
			
			<div class="section-title">
				<h2>自分の投稿</h2>
			</div>
			<div class="timeline">

				<article class="card post-card post-list-card" th:each="post : ${posts}">

					<div class="post-top">
						<div>

							<div class="post-author">

								 <!-- Customer -->
								<span class="role-badge customer" th:if="${post.userType == '1'}">
									<span class="role-dot"></span>
									ユーザー
								</span>

								<!-- Artisan --> 
								<span class="role-badge artisan" th:if="${post.userType == '2'}">
									<span class="role-dot"></span>
									職人
								</span>

								<span class="post-user" th:text="${post.userName}">
									投稿者名
								</span>

							</div>

							<div class="post-date" th:text="${post.postDate}">
								投稿日時
							</div>

						</div>
					</div>

					<!--投稿タイトル -->
					<a class="post-title-link" 
						th:href="@{/postDetail?postId={postId}(postId=${post.postId})}"
						th:text="${post.title}">
						投稿タイトル
					</a>

					 <!-- 投稿本文 --> 
					<p class="post-summary" th:text="${post.summary}">
						投稿本文
					</p>

					<!--ジャンル・タグ -->
					<span class="tag" th:each="tag : ${post.tags}" th:text="'#' + ${tag}">
						#タグ
					</span>


					<!-- いいね -->
					<div class="post-actions">

						<span class="favorite-count" th:text="'いいね:' + ${post.favoriteCount} ">
							いいね:0
						</span>

						<a class="btn btn-primary" th:href="@{/deletePost?postId={postId}(postId=${post.postId})}"
							th:text="'削除'">
						</a>

					</div>

				</article>

			</div>
		</div>
	</main>
</body>

</html>
