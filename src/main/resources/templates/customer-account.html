<!doctype html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ユーザーアカウント | Traemon</title>
	<link rel="stylesheet" href="css/styles.css">
	<script src="js/common.js" defer></script>
</head>

<body>
	<header class="site-header customer-header">
		<div class="container header-inner">
			<a class="logo" href="customer-menu.html">Traemon</a>
			<div class="header-right">
				<span class="role-badge customer"><span class="role-dot"></span>ユーザー</span>
				<a class="header-post customer-post" href="post-create-customer.html">＋ 投稿する</a>
				<div class="notification-wrap">
					<button class="icon-btn" id="notificationButton" type="button" aria-label="通知">🔔</button>
					<div class="notification-panel" id="notificationPanel">
						<div class="notification-item">
							<div>あなたの投稿に反応がありました。</div>
							<small>2026/08/20 10:15</small>
						</div>
						<div class="notification-item">
							<div>「玄関に置ける小さな花器が欲しい」に新しい反応があります。</div>
							<small>2026/08/19 18:40</small>
						</div>
					</div>
				</div>
				<a class="account-btn" href="customer-account.html">伝統工芸が好き</a>
				<a class="logout-btn" href="menu.html">ログアウト</a>
			</div>
		</div>
	</header>

	<main>
		<div class="container">
			<section class="card account-head customer-tile">
				<h1 class="page-title">ユーザーアカウントページ</h1>
				<p>自分が投稿した内容の一覧とアカウント情報を確認できます。</p>
				<div class="form-group">
					<label for="userName">名前</label>
					<input id="userName" type="text" required maxlength="40" th:field="*{userName}" name="userName">
				</div>
				<div class="form-group">
					<label for="email">メールアドレス</label>
					<input id="email" type="email" required th:field="*{email}" name="email">
				</div>

				<div class="account-actions">
					<a class="btn btn-primary" th:href="@{/CustomerAccountEdit}">アカウント編集</a>
					<a class="btn btn-primary" th:href="@{/DeleteCustomerAccount}">削除</a>
				</div>
			</section>
			<div class="section-title">
				<h2>自分の投稿</h2>
			</div>
			<div class="timeline">

				<article class="card post-card post-list-card" th:each="post : ${posts}">

					<div class="post-top">
						<div>

							<div class="post-author">

								<!-- Customer -->
								<span class="role-badge customer" th:if="${post.userType == 'customer'}">
									<span class="role-dot"></span>
									ユーザー
								</span>

								<!-- Artisan -->
								<span class="role-badge artisan" th:if="${post.userType == 'artisan'}">
									<span class="role-dot"></span>
									職人
								</span>

								<span class="post-user" th:text="${post.userName}">
									投稿者名
								</span>

							</div>

							<div class="post-date" th:text="${post.postDate}">
								投稿日時
							</div>

						</div>
					</div>

					<!-- 投稿タイトル -->
					<a class="post-title-link" href="#" th:text="${post.title}">
						投稿タイトル
					</a>

					<!-- 投稿本文 -->
					<p class="post-summary" th:text="${post.summary}">
						投稿本文
					</p>

					<!-- ジャンル・タグ -->
					<span class="tag" th:each="tag : ${post.tags}" th:text="'#' + ${tag}">
						#タグ
					</span>


					<!-- いいね -->
					<div class="post-actions">

						<span class="favorite-count" th:text="'♥ ' + ${post.favoriteCount} + ' いいね'">
							♥ 0 いいね
						</span>

						<a class="btn btn-outline btn-favorite" th:href="@{/customer/login}"
							th:text="'♥ いいね ' + ${post.favoriteCount}">
							♥ いいね
						</a>

					</div>

				</article>

			</div>
		</div>
	</main>
</body>

</html>
