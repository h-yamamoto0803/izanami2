
<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>アカウント詳細 | Traemon</title>
	<link rel="stylesheet" th:href="@{/css/styles.css}">
	<script th:src="@{/js/common.js}" defer></script>
</head>

<body th:with="
    loginUser=${session.loginUser},
    userType=${
        loginUser == null
            ? 'guest'
            : (loginUser.artisan
                ? 'artisan'
                : 'customer')
    }
">
	<div th:replace="~{fragments/header :: header}"></div>
	

	<main>
		<div class="container">
			
				<section class="card account-head customer-tile"
							th:if="${userType == 'customer'}">
								<h1 class="page-title">ユーザーアカウントページ</h1>
								<p>自分が投稿した内容の一覧とアカウント情報を確認できます。</p>
								<div class="form-group">
									<label for="userName">名前</label>
									<span th:text="${userName}"></span>
								</div>
								<div class="form-group">
									<label for="email">メールアドレス</label>
									<span th:text="${email}"></span>
								</div>

								<div class="account-actions">
									<a class="btn btn-primary" th:href="@{/accountEdit}">アカウント編集</a>
									<a class="btn btn-primary" th:href="@{/deleteAccount}">削除</a>
								</div>
							</section>
							
							<section class="card account-head artisan-tile"
										th:if="${userType == 'artisan'}">
											<h1 class="page-title">ユーザーアカウントページ</h1>
											<p>自分が投稿した内容の一覧とアカウント情報を確認できます。</p>
											<div class="form-group">
												<label for="userName">名前</label>
												<span th:text="${userName}"></span>
											</div>
											<div class="form-group">
												<label for="email">メールアドレス</label>
												<span th:text="${email}"></span>
											</div>

											<div class="account-actions">
												<a class="btn btn-primary" th:href="@{/accountEdit}">アカウント編集</a>
												<a class="btn btn-primary" th:href="@{/deleteAccount}">削除</a>
											</div>
										</section>
										<div  th:if="${deleteMessage} != null">
											<span style="color: red;" th:text="${deleteMessage}"></span>
										</div>
										<div th:if="${successMessage != null}">
											    <span style="color: green;"
											          th:text="${successMessage}">
											    </span>
											</div>
			<div class="section-title">
				<h2>自分の投稿</h2>
			</div>
			
			<div class="timeline">

				<article class="card post-card post-list-card" th:each="post : ${posts}">

					<div class="post-top">
						<div>

							<div class="post-author">

								 <!-- Customer -->
								<span class="role-badge customer" th:if="${post.userType == '1'}">
									<span class="role-dot"></span>
									ユーザー
								</span>

								<!-- Artisan --> 
								<span class="role-badge artisan" th:if="${post.userType == '2'}">
									<span class="role-dot"></span>
									職人
								</span>

								<span class="post-user" th:text="${post.userName}">
									投稿者名
								</span>

							</div>

							<div class="post-date" th:text="${post.postDate}">
								投稿日時
							</div>

						</div>
					</div>

					<!--投稿タイトル -->
					<a class="post-title-link" 
						th:href="@{/postDetail?postId={postId}(postId=${post.postId})}"
						th:text="${post.title}">
						投稿タイトル
					</a>

					 <!-- 投稿本文 --> 
					<p class="post-summary" th:text="${post.summary}">
						投稿本文
					</p>

					<!--ジャンル・タグ -->
					<span class="tag" th:each="tag : ${post.tags}" th:text="'#' + ${tag}">
						#タグ
					</span>


					<!-- いいね -->
					<div class="post-actions">

					    <span class="favorite-count"
					          th:text="'いいね:' + ${post.favoriteCount}">
					        いいね:0
					    </span>

					    <form th:action="@{/deletePost}" method="post">
					        <input type="hidden"
					               name="postId"
					               th:value="${post.postId}">

					        <button type="submit" class="btn btn-primary">
					            削除
					        </button>
					    </form>
					</div>

				</article>
				<!-- 職人の場合のみ表示 -->
				<section th:if="${userType == 'artisan'}">

				    <div class="section-title">
				        <h2>自分のポートフォリオ</h2>
				    </div>

				    <div class="timeline">

				        <article class="card post-card post-list-card"
				                 th:each="portfolio : ${portfolios}">

				            <div class="post-top">
				                <div>
				                    <div class="post-author">

				                        <span class="role-badge artisan">
				                            <span class="role-dot"></span>
				                            職人
				                        </span>

				                        <span class="post-user"
				                              th:text="${userName}">
				                            自分の名前
				                        </span>

				                    </div>
				                </div>
				            </div>

				            <!-- 作品画像 -->
				            <img th:src="${portfolio.imagePath}"
				                 alt="作品画像"
				                 style="max-width: 300px;">

				            <!-- 作品説明 -->
				            <p class="post-summary"
				               th:text="${portfolio.description}">
				                作品についての説明
				            </p>
							<div class="post-tags">
							    <span class="tag"
							          th:each="tag : ${portfolio.tags}"
							          th:text="'#' + ${tag}">
							        #タグ
							    </span>
							</div>
				            <div class="post-actions portfolio-actions">

				                <a class="btn btn-primary"
				                   th:href="@{/portfolio-edit(portfolioId=${portfolio.portfolioId})}">
				                    編集
				                </a>

								<form th:action="@{/deletePortfolio}"
								      method="post"
								      onsubmit="return confirm('本当にこのポートフォリオを削除しますか？');">

								    <input type="hidden"
								           name="portfolioId"
								           th:value="${portfolio.portfolioId}">

								    <button type="submit"
								            class="btn btn-primary">
								        削除
								    </button>
								</form>

				            </div>

				        </article>

				    </div>

				</section>
			</div>
		</div>
	</main>
</body>

</html>
