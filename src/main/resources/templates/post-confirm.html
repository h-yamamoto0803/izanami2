<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title> 投稿確認| Traemon</title>
	<link rel="stylesheet" th:href="@{css/styles.css}">
	<script th:src="@{/js/common.js}" defer></script>
</head>

<body>
	<main>
		<div class="container">
			<section>
				<h1 class="page-title">投稿確認ページ</h1>
				<p class="page-subtitle">以下は確認画面の静的サンプルです。</p>
				<div class="card form-card" th:object="${insertPostForm}">
					<dl class="confirm-list">
						<div class="confirm-row">
							<dt>名前</dt>
							<dd>伝統工芸が好き</dd>
						</div>
						<div class="confirm-row">
							<dt>タイトル</dt>
							<dd th:text="*{postTitle}"></dd>
						</div>
						<div class="confirm-row">
							<dt>投稿内容</dt>
							<dd th:text="*{postText}"></dd>
						</div>
						<div class="confirm-row">
							<dt>カテゴリタグ</dt>
							<dd class="tag" th:each="tag : *{tags}" th:text="|#${tag}|"></dd>
						</div>
					</dl>

					<div class="actions">
						<!-- もどる: 入力中の値を持って入力画面へ -->
						<form th:action="@{/insertPost-ret}" method="post" th:object="${insertPostForm}">
							<input type="hidden" th:field="*{postTitle}">
							<input type="hidden" th:field="*{postText}">
							<input th:each="tag : *{tags}" type="hidden" name="tags" th:value="${tag}">
							<button class="btn btn-secondary" type="submit">戻る</button>
						</form>
						
						<!-- 登録実行: 全項目を次のリクエストへ引き継ぐ -->
						<form th:action="@{/post}" method="post" th:object="${insertPostForm}">
							<input type="hidden" th:field="*{postTitle}">
							<input type="hidden" th:field="*{postText}">
							<input th:each="tag : *{tags}" type="hidden" name="tags" th:value="${tag}">
							<a class="btn btn-primary" th:href="@{/menu}">投稿確定</a>
						</form>
					</div>
				</div>
			</section>
		</div>
	</main>
</body>

</html>
