<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投稿確認 | Traemon</title>
<link rel="stylesheet" th:href="@{/css/styles.css}" href="../static/css/styles.css">
<script th:src="@{/js/common.js}" src="../static/js/common.js" defer></script>
</head>
<body>
<div th:replace="~{fragments/header :: header}">
<header class="site-header customer-header">
  <div class="container header-inner">
    <a class="logo" href="customer-menu.html">Traemon</a>
    <div class="header-right">
      <span class="role-badge customer"><span class="role-dot"></span>ユーザー</span>
      <a class="header-post customer-post" href="post-create.html">＋ 投稿する</a>
      <div class="notification-wrap"><button class="icon-btn" type="button" aria-label="通知">🔔</button></div>
      <a class="account-btn" href="customer-account.html">伝統工芸が好き</a>
      <button class="logout-btn" type="button">ログアウト</button>
    </div>
  </div>
</header>
</div>
<main><div class="container"><section>
<h1 class="page-title">投稿確認ページ</h1><p class="page-subtitle">以下の内容で投稿します。確定するまで公開されません。</p>
<form class="card form-card" th:action="@{/posts}" th:object="${postForm}" method="post">
  <dl class="confirm-list">
    <div class="confirm-row"><dt>名前</dt><dd th:text="${session.userName}">伝統工芸が好き</dd></div>
    <div class="confirm-row"><dt>タイトル</dt><dd th:text="*{postTitle}">玄関に置ける小さな花器が欲しい</dd></div>
    <div class="confirm-row"><dt>投稿内容</dt><dd th:text="*{postText}">玄関に置ける小さな花器を探しています。</dd></div>
    <div class="confirm-row"><dt>カテゴリタグ</dt><dd th:text="'#' + *{tag}">#陶芸</dd></div>
  </dl>
  <input type="hidden" th:field="*{postTitle}" name="postTitle">
  <input type="hidden" th:field="*{postText}" name="postText">
  <input type="hidden" th:field="*{tag}" name="tag">
  <div class="actions"><button class="btn btn-secondary" type="submit" th:formaction="@{/posts/create}">戻る</button><button class="btn btn-primary" type="submit">投稿確定</button></div>
</form>
</section></div></main>
</body>
</html>
