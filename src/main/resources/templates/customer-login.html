<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ユーザー用ログイン | Traemon</title>
	<link rel="stylesheet" th:href="@{/css/styles.css}">
	<script th:src="@{/js/common.js}" defer></script>

</head>

<body>

	<div th:replace="~{fragments/header :: header}"></div>

	<main>
		<div class="container">

			<section>
				<h1 class="page-title">ユーザー用ログイン</h1>

				<p class="page-subtitle">
					ユーザーアカウントでTraemonを利用します。
				</p>

				<form class="card form-card" th:action="@{/customer/login}" method="post">
					<p th:if="${errorMessage}" th:text="${errorMessage}"></p>
					<div class="form-group">
						<label for="customerEmail">メールアドレス</label>
						<input id="customerEmail" type="email" name="email" required>
					</div>

					<div class="form-group">
						<label for="customerPassword">パスワード</label>
						<input id="customerPassword" type="password" name="password" required>
					</div>

					<div class="actions">

						<a class="btn btn-secondary" th:href="@{/menu}">
							戻る
						</a>

						<a class="btn btn-outline" href="#">
							新規登録
						</a>

						<button class="btn btn-primary" type="submit">
							ログイン
						</button>

					</div>

				</form>

			</section>

		</div>
	</main>

</body>

</html>
