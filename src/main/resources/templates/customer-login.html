<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ユーザー用ログイン | Traemon</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

<header class="site-header guest-header">
  <div class="container header-inner">

    <a class="logo" th:href="@{/menu}">
      Traemon
    </a>

    <div class="header-right">

      <span class="role-badge guest">
        <span class="role-dot"></span>ゲスト
      </span>

      <a class="header-post guest-post"
         th:href="@{/posts/create}">
        ＋ 投稿する
      </a>

      <a class="header-login artisan-login"
         th:href="@{/artisan/login}">
        職人用ログイン
      </a>

      <a class="header-login customer-login"
         th:href="@{/customer/login}">
        ユーザー用ログイン
      </a>

    </div>
  </div>
</header>

<main>
  <div class="container">

    <section>
      <h1 class="page-title">ユーザー用ログイン</h1>

      <p class="page-subtitle">
        ユーザーアカウントでTraemonを利用します。
      </p>

      <form class="card form-card"
            th:action="@{/customer/login}"
            method="post">

        <div class="form-group">
          <label for="customerEmail">メールアドレス</label>
          <input id="customerEmail"
                 type="email"
                 name="email"
                 required>
        </div>

        <div class="form-group">
          <label for="customerPassword">パスワード</label>
          <input id="customerPassword"
                 type="password"
                 name="password"
                 required>
        </div>

        <div class="actions">

          <a class="btn btn-secondary"
             th:href="@{/menu}">
            戻る
          </a>

          <a class="btn btn-outline"
             href="#">
            新規登録
          </a>

          <button class="btn btn-primary"
                  type="submit">
            ログイン
          </button>

        </div>

      </form>

    </section>

  </div>
</main>

</body>
</html>
