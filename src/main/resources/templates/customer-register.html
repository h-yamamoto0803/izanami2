<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ユーザーアカウント登録 | Traemon</title>
<link rel="stylesheet" href="../css/styles.css">
<script src="../js/common.js" defer></script>
</head>
<body>
<div id="header"></div>
<main>
<div class="container">

<section>
  <h1 class="page-title">ユーザーアカウント登録</h1>
  <p class="page-subtitle">アカウント情報を入力してください。</p>

  <form id="registerForm" class="card form-card">
    <div class="form-group">
      <label for="name">名前</label>
      <input id="name" name="name" type="text" required maxlength="40" placeholder="例：山田 太郎">
    </div>
    <div class="form-group">
      <label for="email">メールアドレス</label>
      <input id="email" name="email" type="email" required>
    </div>
    <div class="form-group">
      <label for="password">パスワード</label>
      <input id="password" name="password" type="password" required minlength="6">
    </div>
    <div class="form-group">
      <label for="passwordConfirm">確認用パスワード</label>
      <input id="passwordConfirm" name="passwordConfirm" type="password" required minlength="6">
    </div>
    <p id="error" style="color:#b52e3c;text-align:center;font-size:12px"></p>

    <div class="actions">
      <a class="btn btn-secondary" href="customer-login.html">戻る</a>
      <button class="btn btn-primary" type="submit">登録内容を確認</button>
    </div>
  </form>
</section>

</div>
</main>
<script>
document.addEventListener("DOMContentLoaded",()=>{
  Traemon.$("#registerForm").addEventListener("submit",e=>{
    e.preventDefault();
    const p=Traemon.$("#password").value;
    const pc=Traemon.$("#passwordConfirm").value;
    if(p!==pc){
      Traemon.$("#error").textContent="パスワードが一致していません。";
      return;
    }
    Traemon.saveAccountDraft(e.target);
    location.href="customer-register-confirm.html";
  });
});
</script>
</body>
</html>
