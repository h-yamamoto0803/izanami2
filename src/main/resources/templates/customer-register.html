<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ユーザーアカウント登録 | Traemon</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main><div class="container"><section>
  <h1 class="page-title">ユーザーアカウント登録</h1>
  <p class="page-subtitle">アカウント情報を入力してください。</p>

  <form class="card form-card" 
  action="insertCustomerConfirm" 
  method="post" 
  th:object="${insertCustomerForm}">	
    <div class="form-group">
		<label for="userName">名前</label>
		<input maxlength="50"
		       placeholder="ユーザー名"
		       required="required"
		       th:field="*{userName}"
		       type="text"/>
	</div>
    <div class="form-group">
		<label for="email">メールアドレス</label>
		<input maxlength="255"
				       placeholder="メールアドレス"
				       required="required"
				       th:field="*{email}"
				       type="email"/>
	</div>
    <div class="form-group">
		<label for="password">パスワード</label>
		<input pattern="^(?=.*?[a-zA-Z])(?=.*?\d)[a-zA-Z\d]{3,10}$"
				       placeholder="パスワード   ※英字と数字を両方含む、3～10文字の半角英数字"
				       required="required"
				       th:field="*{password}"
				       type="password"/>
	</div>
    <div class="form-group">
		<label for="passwordConfirm">確認用パスワード</label>
		<input pattern="^(?=.*?[a-zA-Z])(?=.*?\d)[a-zA-Z\d]{3,10}$"
				       placeholder="確認用パスワード"
				       required="required"
				       th:field="*{passwordConfirm}"
				       type="password"/>
	</div>
	<p style="color: red;"
	   th:if="${messageError != null}"
	   th:text="${messageError.message}">
	</p>
    <div class="actions"><button class="btn btn-primary" type="submit">登録内容を確認</button><a class="btn btn-secondary" href="menu">戻る</a></div>
  </form>
</section></div></main>
</body>
</html>
