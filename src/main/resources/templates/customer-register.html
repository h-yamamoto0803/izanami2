<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ユーザーアカウント登録 | Traemon</title>
<link rel="stylesheet" th:href="@{/css/styles.css}" href="../static/css/styles.css">
<script th:src="@{/js/common.js}" src="../static/js/common.js" defer></script>
</head>
<body>
<div th:replace="~{fragments/header :: header}">
<header class="site-header gest-header">
  <div class="container header-inner">
    <a class="logo" href="menu.html">Traemon</a>
    <div class="header-right">
      <span class="role-badge gest"><span class="role-dot"></span>ゲスト</span>
      <a class="header-post gest-post" href="post-create.html">＋ 投稿する</a>
      <a class="header-login artisan-login" href="artisan-login.html">職人用ログイン</a>
      <a class="header-login customer-login" href="customer-login.html">ユーザー用ログイン</a>
    </div>
  </div>
</header>
</div>
<main><div class="container"><section>
<h1 class="page-title">ユーザーアカウント登録</h1><p class="page-subtitle">アカウント情報を入力してください。</p>
<form class="card form-card" th:action="@{/customer/register/confirm}" th:object="${registerForm}" method="post">
  <div class="form-group"><label for="userName">名前</label><input id="userName" type="text" required maxlength="40" placeholder="例：山田 太郎" th:field="*{userName}" name="userName"></div>
  <div class="form-group"><label for="email">メールアドレス</label><input id="email" type="email" required th:field="*{email}" name="email"></div>
  <div class="form-group"><label for="password">パスワード</label><input id="password" type="password" required minlength="6" th:field="*{password}" name="password"></div>
  <div class="form-group"><label for="passwordConfirm">確認用パスワード</label><input id="passwordConfirm" type="password" required minlength="6" th:field="*{passwordConfirm}" name="passwordConfirm"></div>
  <p class="form-error" hidden th:if="${errorMessage}" th:attr="hidden=${errorMessage} ? null : 'hidden'" th:text="${errorMessage}" style="color:#b52e3c;text-align:center;font-size:12px">入力内容を確認してください。</p>
  <div class="actions"><a class="btn btn-secondary" th:href="@{/customer/login}" href="customer-login.html">戻る</a><button class="btn btn-primary" type="submit">登録内容を確認</button></div>
</form>
</section></div></main>
</body>
</html>
