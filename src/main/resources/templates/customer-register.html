<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ユーザーアカウント登録 | Traemon</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="site-header guest-header">
  <div class="container header-inner">
    <a class="logo" href="menu.html">Traemon</a>
    <div class="header-right">
      <span class="role-badge guest"><span class="role-dot"></span>ゲスト</span>
      <a class="header-post guest-post" href="post-create-guest.html">＋ 投稿する</a>
      <a class="header-login artisan-login" href="artisan-login.html">職人用ログイン</a>
      <a class="header-login customer-login" href="customer-login.html">ユーザー用ログイン</a>
    </div>
  </div>
</header>
<main><div class="container"><section>
  <h1 class="page-title">ユーザーアカウント登録</h1><p class="page-subtitle">アカウント情報を入力してください。</p>
  <form class="card form-card" action="customer-register-confirm.html" method="get">
    <div class="form-group"><label for="userName">名前</label><input id="userName" name="userName" type="text" required value="山田 太郎"></div>
    <div class="form-group"><label for="email">メールアドレス</label><input id="email" name="email" type="email" required value="user@example.com"></div>
    <div class="form-group"><label for="password">パスワード</label><input id="password" name="password" type="password" required value="password"></div>
    <div class="form-group"><label for="passwordConfirm">確認用パスワード</label><input id="passwordConfirm" name="passwordConfirm" type="password" required value="password"></div>
    <div class="actions"><a class="btn btn-secondary" href="customer-login.html">戻る</a><button class="btn btn-primary" type="submit">登録内容を確認</button></div>
  </form>
</section></div></main>
</body>
</html>
