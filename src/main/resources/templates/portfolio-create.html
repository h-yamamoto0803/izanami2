<!doctype html>

<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ポートフォリオ作成 | Traemon</title>
	<link rel="stylesheet" th:href="@{/css/styles.css}">
	<script th:src="@{/js/common.js}" defer></script>
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main>
	<div class="container">
	<section>
		<h1 class="page-title">ポートフォリオ作成ページ</h1>
		<p class="page-subtitle">
			作品画像と作品についての説明を入力してください。
		</p>

		<form class="card form-card"
			  th:action="@{/portfolio-create-confirm}"
			  th:object="${portfolioForm}"
			  method="post"
			  enctype="multipart/form-data">

			<!-- 作品画像 -->
			<div class="form-group">
				<label for="portfolioImage">作品画像</label>
				<input id="portfolioImage"
					   type="file"
					   accept="image/*"
					   th:field="*{image}">
			</div>
			<p th:if="${#fields.hasErrors('image')}"
											    th:errors="*{image}"
											    style="color: red;">
											 </p>
			<!-- 作品説明 -->
			<div class="form-group">
				<label for="portfolioDescription">作品説明</label>
				<textarea id="portfolioDescription"
						  rows="8"
						  placeholder="作品について説明してください。"
						  th:field="*{description}"></textarea>
			</div>
			<p th:if="${#fields.hasErrors('description')}"
								   th:errors="*{description}"
								   style="color: red;">
								</p>
								
								<div class="form-group">
								    <label>タグ</label>

								    <div class="tag-select">
								        <button type="button"
								                id="tagDropdownButton"
								                class="tag-select-button">
								            タグを選択 ▼
								        </button>

								        <div id="tagDropdown"
								             class="tag-dropdown">

								            <label th:each="tag : ${tags}"
								                   class="tag-option">

								                <input type="checkbox"
								                       th:field="*{tagIds}"
								                       th:value="${tag.tagId}"
								                       th:data-name="${tag.tagName}"
								                       class="tag-checkbox">

								                <span th:text="${tag.tagName}"></span>
								            </label>

								        </div>
								    </div>

								    <div id="selectedTags"
								         class="selected-tags">
								    </div>

								    <div th:if="${#fields.hasErrors('tagIds')}"
								         th:errors="*{tagIds}"
								         class="error-message">
								    </div>
								</div>
			<div class="actions">
				<button class="btn btn-primary" type="submit">
					確認画面へ
				</button>

				<a class="btn btn-secondary" th:href="@{/menu}">
					戻る
				</a>
			</div>

		</form>

	</section>

</div>


</main>

</body>
</html>
