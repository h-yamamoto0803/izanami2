<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>職人用ログイン | Traemon</title>
<link rel="stylesheet" th:href="@{/css/styles.css}" href="../static/css/styles.css">
<script th:src="@{/js/common.js}" src="../static/js/common.js" defer></script>
</head>
<body>
<div th:replace="~{fragments/header :: header}">
<header class="site-header gest-header">
  <div class="container header-inner">
    <a class="logo" href="menu.html">Traemon</a>
    <div class="header-right">
      <span class="role-badge gest"><span class="role-dot"></span>ゲスト</span>
      <a class="header-post gest-post" href="post-create.html">＋ 投稿する</a>
      <a class="header-login artisan-login" href="artisan-login.html">職人用ログイン</a>
      <a class="header-login customer-login" href="customer-login.html">ユーザー用ログイン</a>
    </div>
  </div>
</header>
</div>
<main><div class="container"><section>
  <h1 class="page-title">職人用ログイン</h1>
  <p class="page-subtitle">職人アカウントでTraemonを利用します。</p>
  <form class="card form-card" th:action="@{/artisan/login}" th:object="${loginForm}" method="post">
    <div class="form-group"><label for="email">メールアドレス</label><input id="email" type="email" required placeholder="artisan@example.com" th:field="*{email}" name="email"></div>
    <div class="form-group"><label for="password">パスワード</label><input id="password" type="password" required th:field="*{password}" name="password"></div>
    <p class="form-error" hidden th:if="${errorMessage}" th:attr="hidden=${errorMessage} ? null : 'hidden'" th:text="${errorMessage}" style="color:#b52e3c;text-align:center;font-size:12px">ログイン情報を確認してください。</p>
    <div class="actions"><a class="btn btn-secondary" th:href="@{/menu}" href="menu.html">戻る</a><button class="btn btn-primary" type="submit">ログイン</button></div>
  </form>
</section></div></main>
</body>
</html>
