<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポートフォリオ編集確認 | Traemon</title>

    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script th:src="@{/js/common.js}" defer></script>
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<main>
    <div class="container">

        <section>
            <h1 class="page-title">
                ポートフォリオ編集確認ページ
            </h1>

            <div class="card form-card">

                <dl class="confirm-list">

                    <!-- 作品画像 -->
                    <div class="confirm-row">
                        <dt>作品画像</dt>

                        <dd>
                            <img th:src="${portfolioForm.tempImagePath}"
                                 alt="作品画像"
                                 style="max-width:300px; width:100%; height:auto;">
                        </dd>
                    </div>

                    <!-- 作品説明 -->
                    <div class="confirm-row">
                        <dt>作品説明</dt><dd th:text="${portfolioForm.description}">作品説明</dd>
                    </div>

                </dl>
				<!-- タグ -->
				<div class="confirm-row"><dt>タグ</dt><dd><span th:each="tagName : ${tagNames}" class="tag" th:text="'#' + ${tagName}">#タグ</span>
				    </dd>
				</div>
                <div class="actions">

                    <!-- 更新実行 -->
					<form th:action="@{/portfolio-update}"
					      th:object="${portfolioForm}"
					      method="post">

					    <!-- 編集対象 -->
					    <input type="hidden"
					           th:field="*{portfolioId}">

					    <!-- 説明 -->
					    <input type="hidden"
					           th:field="*{description}">

					    <!-- 確認画面で表示している画像パス -->
					    <input type="hidden"
					           th:field="*{tempImagePath}">

					    <!-- タグ -->
					    <input type="hidden"th:each="tagId : ${portfolioForm.tagIds}"name="tagIds"th:value="${tagId}">

					    <button class="btn btn-primary"
					            type="submit">
					        変更を確定
					    </button>

					</form>

                    <!-- 編集画面へ戻る -->
                    <a class="btn btn-secondary"
                       th:href="@{/portfolio-edit(portfolioId=${portfolioForm.portfolioId})}">
                        戻る
                    </a>

                </div>

            </div>
        </section>

    </div>
</main>

</body>
</html>
