<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ユーザーアカウント編集 | Traemon</title>
<link rel="stylesheet" href="../css/styles.css">
<script src="../js/common.js" defer></script>
</head>
<body>
<div id="header"></div>
<main>
<div class="container">

<section>
  <h1 class="page-title">ユーザーアカウント編集</h1>
  <p class="page-subtitle">変更したい情報を入力してください。</p>

  <form id="editForm" class="card form-card">
    <div class="form-group">
      <label for="name">名前</label>
      <input id="name" name="name" type="text" required maxlength="40">
    </div>
    <div class="form-group">
      <label for="email">メールアドレス</label>
      <input id="email" name="email" type="email" required>
    </div>
    <div class="form-group">
      <label for="password">パスワード</label>
      <input id="password" name="password" type="password" required minlength="6">
    </div>
    <div class="form-group">
      <label for="passwordConfirm">確認用パスワード</label>
      <input id="passwordConfirm" name="passwordConfirm" type="password" required minlength="6">
    </div>
    <p id="error" style="color:#b52e3c;text-align:center;font-size:12px"></p>

    <div class="actions">
      <a class="btn btn-secondary" href="consumer-account.html">戻る</a>
      <button class="btn btn-primary" type="submit">確認画面へ</button>
    </div>
  </form>
</section>

</div>
</main>
<script>
document.addEventListener("DOMContentLoaded",()=>{
  if(!Traemon.requireLogin("consumer")) return;
  const s=Traemon.getSession();
  Traemon.$("#name").value=s.displayName || "ユーザー";
  Traemon.$("#email").value=s.email;

  Traemon.$("#editForm").addEventListener("submit",e=>{
    e.preventDefault();
    if(Traemon.$("#password").value!==Traemon.$("#passwordConfirm").value){
      Traemon.$("#error").textContent="パスワードが一致していません。";
      return;
    }
    Traemon.saveAccountDraft(e.target);
    location.href="consumer-account-edit-confirm.html";
  });
});
</script>
</body>
</html>
