<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デモデータ初期化 | Traemon</title>
<link rel="stylesheet" href="../css/styles.css">
<script src="../js/common.js" defer></script>
</head>
<body>
<div id="header"></div>
<main>
<div class="container">

<section class="card form-card">
  <h1 class="page-title">デモデータ初期化</h1>
  <p class="page-subtitle">localStorage / sessionStorageを削除して最初の状態に戻します。</p>
  <button class="btn btn-danger" id="reset">初期化する</button>
</section>

</div>
</main>
<script>
document.addEventListener("DOMContentLoaded",()=>{
  Traemon.$("#reset").addEventListener("click",()=>{
    localStorage.clear();
    sessionStorage.clear();
    location.href="menu.html";
  });
});
</script>
</body>
</html>
