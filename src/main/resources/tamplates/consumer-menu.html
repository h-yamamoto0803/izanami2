<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ユーザー専用メニュー | Traemon</title>
<link rel="stylesheet" href="../css/styles.css">
<script src="../js/common.js" defer></script>
</head>
<body>
<div id="header"></div>
<main>
<div class="container">

<section class="hero consumer-tile">
  <h1>ユーザー専用メニュー</h1>
  <p>職人の作品や、ほかのユーザーが投稿した需要をチェックできます。</p>
</section>


<div class="toolbar">
  <div class="search-area"><input id="searchInput" type="search" placeholder="投稿・ユーザー・タグを検索"></div>
  <select id="tagFilter"></select>
</div>

<div id="postList" class="timeline"></div>


</div>
</main>
<script>
document.addEventListener("DOMContentLoaded",()=>{
  if(!Traemon.requireLogin("consumer")) return;
  Traemon.setupTimeline();
});
</script>
</body>
</html>
