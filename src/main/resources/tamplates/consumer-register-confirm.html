<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ユーザーアカウント登録確認 | Traemon</title>
<link rel="stylesheet" href="../css/styles.css">
<script src="../js/common.js" defer></script>
</head>
<body>
<div id="header"></div>
<main>
<div class="container">

<section>
  <h1 class="page-title">ユーザーアカウント登録確認</h1>
  <p class="page-subtitle">入力した内容を確認してください。</p>

  <div class="card form-card">
    <div id="confirmArea"></div>
    <div class="notice" style="margin-top:18px">
      ※これはフロントエンドのデモです。実運用ではパスワードをこのように表示しないでください。
    </div>
    <div class="actions">
      <a class="btn btn-secondary" href="consumer-register.html">戻る</a>
      <button id="registerBtn" class="btn btn-primary">登録確定</button>
    </div>
  </div>
</section>

</div>
</main>
<script>
document.addEventListener("DOMContentLoaded",()=>{
  const d=Traemon.getAccountDraft();
  if(!d){ location.href="consumer-register.html"; return; }

  Traemon.$("#confirmArea").innerHTML=`
    <dl class="confirm-list">
      <div class="confirm-row"><dt>名前</dt><dd>${Traemon.escapeHtml(d.name)}</dd></div>
      <div class="confirm-row"><dt>メールアドレス</dt><dd>${Traemon.escapeHtml(d.email)}</dd></div>
      <div class="confirm-row"><dt>パスワード</dt><dd>${Traemon.escapeHtml(d.password)}</dd></div>
      <div class="confirm-row"><dt>確認用パスワード</dt><dd>${Traemon.escapeHtml(d.passwordConfirm)}</dd></div>
    </dl>`;

  Traemon.$("#registerBtn").addEventListener("click",()=>{
    if(Traemon.registerAccount()){
      location.href="consumer-menu.html";
    }else{
      alert("このメールアドレスはすでに登録されています。");
    }
  });
});
</script>
</body>
</html>
